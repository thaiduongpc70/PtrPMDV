<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Food Delivery API Docs</title>
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css" />
    <style>
      body { margin: 0; background: #f8fafc; }
      .fallback { max-width: 880px; margin: 24px auto; padding: 16px 20px; background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; font-family: system-ui, sans-serif; }
      code { background: #f1f5f9; padding: 2px 6px; border-radius: 6px; }
    </style>
  </head>
  <body>
    <div id="swagger-ui"></div>
    <noscript>
      <div class="fallback">
        Bật JavaScript để xem Swagger UI, hoặc mở trực tiếp <code>/api/openapi.json</code>.
      </div>
    </noscript>
    <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
    <script>
      if (window.SwaggerUIBundle) {
        window.SwaggerUIBundle({
          url: '/api/openapi.json',
          dom_id: '#swagger-ui',
          deepLinking: true,
          persistAuthorization: true,
          presets: [window.SwaggerUIBundle.presets.apis],
          layout: 'BaseLayout'
        });
      } else {
        document.getElementById('swagger-ui').innerHTML = '<div class="fallback">Không tải được Swagger UI CDN. Mở /api/openapi.json để xem OpenAPI contract.</div>';
      }
    </script>
  </body>
</html>
