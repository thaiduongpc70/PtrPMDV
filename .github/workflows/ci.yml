name: food-delivery-ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: food-delivery-platform/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: food-delivery-platform/backend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
        env:
          DB_PASSWORD: test-password
          JWT_SECRET: test-secret-for-ci-only-1234567890
