$kind: http-request
url: "{{baseUrl}}/api/admin/manage/orders?page=1&pageSize=5"
method: GET
headers:
  Content-Type: application/json
  Authorization: Bearer {{adminToken}}
queryParams:
  page: "1"
  pageSize: "5"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Orders list: HTTP 200', () => pm.expect(pm.response.code).to.be.oneOf([200]));
      pm.test("orders paged", () => pm.expect(Array.isArray(json.items) && json.totalItems >= json.items.length).to.be.true);
      { const v = (json.items[0]?.id); if (v !== undefined && v !== null) pm.collectionVariables.set('adminOrderId', v); }
    language: text/javascript
order: 2000
