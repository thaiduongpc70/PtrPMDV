$kind: http-request
url: "{{baseUrl}}/api/admin/manage/reports?days=30"
method: GET
headers:
  Content-Type: application/json
  Authorization: Bearer {{adminToken}}
queryParams:
  days: "30"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Reports (30 days): HTTP 200', () => pm.expect(pm.response.code).to.be.oneOf([200]));
      pm.test("report sections present", () => pm.expect(Array.isArray(json.daily) && json.delivery && Array.isArray(json.topRestaurants)).to.be.true);
    language: text/javascript
order: 11000
