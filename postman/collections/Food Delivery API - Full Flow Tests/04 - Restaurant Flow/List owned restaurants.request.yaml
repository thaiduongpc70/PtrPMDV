$kind: http-request
url: "{{baseUrl}}/api/restaurant/restaurants"
method: GET
headers:
  Content-Type: application/json
  Authorization: Bearer {{restaurantToken}}
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('List owned restaurants: HTTP 200', () => pm.expect(pm.response.code).to.be.oneOf([200]));
      pm.test("owner has restaurants", () => pm.expect((json.items || json).length >= 1).to.be.true);
    language: text/javascript
order: 1000
