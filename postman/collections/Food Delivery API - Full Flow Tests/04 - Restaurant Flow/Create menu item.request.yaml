$kind: http-request
url: "{{baseUrl}}/api/restaurant/restaurants/{{restaurantId}}/menu-items"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{restaurantToken}}
body:
  type: json
  content: |-
    {
      "name": "Cơm gà xối mỡ (Postman)",
      "description": "Món tạo bởi test Postman",
      "basePrice": 45000,
      "discountPrice": null,
      "preparationTime": 15,
      "isAvailable": true,
      "isFeatured": false
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Create menu item: HTTP 201', () => pm.expect(pm.response.code).to.be.oneOf([201]));
      pm.test("item created", () => pm.expect(json.id > 0).to.be.true);
      { const v = (json.id); if (v !== undefined && v !== null) pm.collectionVariables.set('tmpItemId', v); }
    language: text/javascript
order: 2000
