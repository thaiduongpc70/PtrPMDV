$kind: http-request
url: "{{baseUrl}}/api/restaurant/restaurants/{{restaurantId}}/menu-items"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{customerToken}}
body:
  type: json
  content: |-
    {
      "name": "x",
      "basePrice": 1000
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Customer cannot create menu item: HTTP 403', () => pm.expect(pm.response.code).to.be.oneOf([403]));
    language: text/javascript
order: 6000
