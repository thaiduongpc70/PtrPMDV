$kind: http-request
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "emailOrUsername": "thaiduongpc7",
      "password": "duong2k5"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Login admin: HTTP 200', () => pm.expect(pm.response.code).to.be.oneOf([200]));
      pm.test("role is ADMIN", () => pm.expect(json.user.role).to.eql("ADMIN"));
      pm.collectionVariables.set('adminToken', json.accessToken);
    language: text/javascript
order: 7000
