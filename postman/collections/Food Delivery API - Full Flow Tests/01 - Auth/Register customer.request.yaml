$kind: http-request
url: "{{baseUrl}}/api/auth/register/customer"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "{{regUser}}",
      "email": "{{regUser}}@example.vn",
      "phone": "{{regPhone}}",
      "password": "duong2k5",
      "fullName": "Nguyen Van A",
      "gender": "OTHER"
    }
auth:
  type: noauth
scripts:
  - type: beforeRequest
    code: |-
      const s = Date.now().toString(36);
      pm.collectionVariables.set('regUser', 'auth' + s);
      pm.collectionVariables.set('regPhone', '09' + String(Math.floor(10000000 + Math.random() * 89999999)));
    language: text/javascript
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Register customer: HTTP 201', () => pm.expect(pm.response.code).to.be.oneOf([201]));
      pm.test("registered as CUSTOMER", () => pm.expect(json.user.role).to.eql("CUSTOMER"));
      pm.test("tokens issued", () => pm.expect(!!json.accessToken && !!json.refreshToken).to.be.true);
      pm.collectionVariables.set('freshToken', json.accessToken);
      pm.collectionVariables.set('freshRefresh', json.refreshToken);
      pm.collectionVariables.set('freshUserId', json.user.id);
    language: text/javascript
order: 1000
