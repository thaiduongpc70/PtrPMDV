$kind: http-request
url: "{{baseUrl}}/api/auth/register/customer"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "weakpass1",
      "email": "weakpass1@example.vn",
      "password": "123",
      "fullName": "Weak"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Register - weak password rejected: HTTP 400', () => pm.expect(pm.response.code).to.be.oneOf([400]));
    language: text/javascript
order: 3000
