$kind: http-request
url: "{{baseUrl}}/api/auth/refresh"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "refreshToken": "{{freshRefresh}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Refresh token: HTTP 200', () => pm.expect(pm.response.code).to.be.oneOf([200]));
      pm.test("new access token", () => pm.expect(!!json.accessToken).to.be.true);
      pm.collectionVariables.set('freshRefresh', json.refreshToken);
    language: text/javascript
order: 13000
