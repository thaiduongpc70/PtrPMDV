$kind: http-request
url: "{{baseUrl}}/health"
method: GET
headers:
  Content-Type: application/json
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Health overall: HTTP 200', () => pm.expect(pm.response.code).to.be.oneOf([200]));
      pm.test("timestamp present", () => pm.expect(!!json.timestamp).to.be.true);
    language: text/javascript
order: 3000
