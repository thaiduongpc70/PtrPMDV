$kind: http-request
url: "{{baseUrl}}/api/payments/orders/{{orderId}}"
method: GET
headers:
  Content-Type: application/json
  Authorization: Bearer {{customerToken}}
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Order payments: HTTP 200', () => pm.expect(pm.response.code).to.be.oneOf([200]));
      pm.test("payment row exists", () => pm.expect(json.items.length >= 1).to.be.true);
      { const v = (json.items[0]?.id); if (v !== undefined && v !== null) pm.collectionVariables.set('paymentId', v); }
    language: text/javascript
order: 1000
