$kind: http-request
url: "{{baseUrl}}/api/payments/{{paymentId}}/callback"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{customerToken}}
body:
  type: json
  content: |-
    {
      "status": "PAID"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Customer cannot call payment callback: HTTP 403', () => pm.expect(pm.response.code).to.be.oneOf([403]));
    language: text/javascript
order: 3000
