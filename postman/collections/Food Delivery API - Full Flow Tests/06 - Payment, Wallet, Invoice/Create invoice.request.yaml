$kind: http-request
url: "{{baseUrl}}/api/payments/orders/{{orderId}}/invoice"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{customerToken}}
body:
  type: json
  content: "{}"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Create invoice: HTTP 200/201', () => pm.expect(pm.response.code).to.be.oneOf([200, 201]));
      pm.test("invoice number issued", () => pm.expect(!!json.invoiceNumber).to.be.true);
    language: text/javascript
order: 4000
