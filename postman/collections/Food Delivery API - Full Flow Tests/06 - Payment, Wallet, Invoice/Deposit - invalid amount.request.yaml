$kind: http-request
url: "{{baseUrl}}/api/payments/wallet/deposit"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{customerToken}}
body:
  type: json
  content: |-
    {
      "amount": -5
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Deposit - invalid amount: HTTP 400', () => pm.expect(pm.response.code).to.be.oneOf([400]));
    language: text/javascript
order: 9000
