$kind: http-request
url: "{{baseUrl}}/api/admin/export/orders"
method: GET
headers:
  Content-Type: application/json
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Anonymous cannot export: HTTP 401', () => pm.expect(pm.response.code).to.be.oneOf([401]));
    language: text/javascript
order: 15000
