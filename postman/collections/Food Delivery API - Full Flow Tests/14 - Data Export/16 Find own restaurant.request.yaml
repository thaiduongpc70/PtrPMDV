$kind: http-request
url: "{{baseUrl}}/api/restaurant/restaurants"
method: GET
headers:
  Content-Type: application/json
  Authorization: Bearer {{restaurantToken}}
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Find own restaurant: HTTP 200', () => pm.expect(pm.response.code).to.be.oneOf([200]));
      { const v = (json.items && json.items[0] && json.items[0].id); if (v !== undefined && v !== null) pm.collectionVariables.set('ownRestaurantId', v); }
    language: text/javascript
order: 16000
