$kind: http-request
url: "{{baseUrl}}/api/communications/chat/sessions/{{chatSessionId}}/messages"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{customerToken}}
body:
  type: json
  content: |-
    {
      "message": "Xin chào, cảm ơn quán!"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Send chat message: HTTP 201', () => pm.expect(pm.response.code).to.be.oneOf([201]));
    language: text/javascript
order: 2000
