$kind: http-request
url: "{{baseUrl}}/api/communications/orders/{{orderId}}/restaurant-review"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{customerToken}}
body:
  type: json
  content: |-
    {
      "rating": 5,
      "comment": "Món ngon, giao nhanh."
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Review restaurant: HTTP 200/201', () => pm.expect(pm.response.code).to.be.oneOf([200, 201]));
    language: text/javascript
order: 6000
