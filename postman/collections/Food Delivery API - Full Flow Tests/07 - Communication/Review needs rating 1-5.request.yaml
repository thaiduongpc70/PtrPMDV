$kind: http-request
url: "{{baseUrl}}/api/communications/orders/{{orderId}}/restaurant-review"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{customerToken}}
body:
  type: json
  content: |-
    {
      "rating": 9
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Review needs rating 1-5: HTTP 400', () => pm.expect(pm.response.code).to.be.oneOf([400]));
    language: text/javascript
order: 8000
