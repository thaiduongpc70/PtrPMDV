$kind: http-request
url: "{{baseUrl}}/api/settlements/admin/settlements/generate"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{adminToken}}
body:
  type: json
  content: |-
    {
      "periodStart": "2026-09-01",
      "periodEnd": "2026-09-30",
      "commissionRate": 0.18
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Generate settlements: HTTP 200/201', () => pm.expect(pm.response.code).to.be.oneOf([200, 201]));
    language: text/javascript
order: 8000
