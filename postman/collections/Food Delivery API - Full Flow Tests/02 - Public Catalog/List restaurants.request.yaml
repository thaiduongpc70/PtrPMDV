$kind: http-request
url: "{{baseUrl}}/api/catalog/restaurants?pageSize=20"
method: GET
headers:
  Content-Type: application/json
queryParams:
  pageSize: "20"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('List restaurants: HTTP 200', () => pm.expect(pm.response.code).to.be.oneOf([200]));
      pm.test("restaurants exist", () => pm.expect(json.items.length > 0).to.be.true);
      { const v = (json.items[0].id); if (v !== undefined && v !== null) pm.collectionVariables.set('publicRestaurantId', v); }
    language: text/javascript
order: 4000
