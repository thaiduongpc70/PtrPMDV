$kind: http-request
url: "{{baseUrl}}/api/catalog/restaurants/{{publicRestaurantId}}"
method: GET
headers:
  Content-Type: application/json
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Restaurant detail: HTTP 200', () => pm.expect(pm.response.code).to.be.oneOf([200]));
      pm.test("matching restaurant", () => pm.expect(json.id == pm.collectionVariables.get("publicRestaurantId")).to.be.true);
    language: text/javascript
order: 6000
