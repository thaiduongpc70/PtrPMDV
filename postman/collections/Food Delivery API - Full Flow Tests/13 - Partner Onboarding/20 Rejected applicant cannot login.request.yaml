$kind: http-request
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "emailOrUsername": "nhb{{pSuffix}}",
      "password": "duong2k5"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Rejected applicant cannot login: HTTP 403', () => pm.expect(pm.response.code).to.be.oneOf([403]));
      pm.test("login says INACTIVE", () => pm.expect(json.message === "Account is INACTIVE").to.be.true);
    language: text/javascript
order: 20000
