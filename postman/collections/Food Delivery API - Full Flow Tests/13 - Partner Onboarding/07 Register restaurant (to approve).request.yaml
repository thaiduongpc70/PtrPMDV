$kind: http-request
url: "{{baseUrl}}/api/partners/register/restaurant"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "ownerName": "Chủ quán Postman",
      "username": "nha{{pSuffix}}",
      "email": "nha{{pSuffix}}@postman.test",
      "phone": "081{{pSuffix}}",
      "password": "duong2k5",
      "restaurantName": "Quán Postman nha {{pSuffix}}",
      "address": "12 Lê Lợi",
      "ward": "Bến Nghé",
      "district": "Quận 1",
      "city": "TP.HCM",
      "openingTime": "08:00",
      "closingTime": "22:00",
      "minimumOrder": 30000,
      "description": "Quán tạo bởi collection Postman"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Register restaurant (to approve): HTTP 201', () => pm.expect(pm.response.code).to.be.oneOf([201]));
      { const v = (json.applicationId); if (v !== undefined && v !== null) pm.collectionVariables.set('restAppId', v); }
    language: text/javascript
order: 7000
