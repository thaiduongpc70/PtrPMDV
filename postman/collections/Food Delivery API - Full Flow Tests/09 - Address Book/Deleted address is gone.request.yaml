$kind: http-request
url: "{{baseUrl}}/api/customer/addresses/{{tmpAddressId}}"
method: GET
headers:
  Content-Type: application/json
  Authorization: Bearer {{customerToken}}
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Deleted address is gone: HTTP 404', () => pm.expect(pm.response.code).to.be.oneOf([404]));
    language: text/javascript
order: 9000
