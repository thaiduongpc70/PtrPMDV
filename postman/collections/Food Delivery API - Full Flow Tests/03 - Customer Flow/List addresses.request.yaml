$kind: http-request
url: "{{baseUrl}}/api/customer/addresses"
method: GET
headers:
  Content-Type: application/json
  Authorization: Bearer {{customerToken}}
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('List addresses: HTTP 200', () => pm.expect(pm.response.code).to.be.oneOf([200]));
      pm.test("customer has addresses", () => pm.expect(json.items.length >= 1).to.be.true);
      { const v = (json.items.find(a => a.isDefault)?.id ?? json.items[0]?.id); if (v !== undefined && v !== null) pm.collectionVariables.set('addressId', v); }
    language: text/javascript
order: 3000
