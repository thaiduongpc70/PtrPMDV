$kind: http-request
url: "{{baseUrl}}/api/restaurant/restaurants/{{restaurantId}}/menu-items?pageSize=5"
method: GET
headers:
  Content-Type: application/json
  Authorization: Bearer {{restaurantToken}}
queryParams:
  pageSize: "5"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Setup - menu item: HTTP 200', () => pm.expect(pm.response.code).to.be.oneOf([200]));
      { const v = ((json.items || json)[0]?.id); if (v !== undefined && v !== null) pm.collectionVariables.set('menuItemId', v); }
    language: text/javascript
order: 2000
