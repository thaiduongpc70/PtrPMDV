$kind: http-request
url: "{{baseUrl}}/api/customer/orders/checkout"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{customerToken}}
body:
  type: json
  content: |-
    {
      "restaurantId": {{restaurantId}},
      "addressId": {{addressId}},
      "paymentMethod": "BANK_TRANSFER",
      "customerNote": "Gọi trước khi giao"
    }
auth:
  type: noauth
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set('idemKey', 'postman-' + Date.now());
    language: text/javascript
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Checkout order: HTTP 200/201', () => pm.expect(pm.response.code).to.be.oneOf([200, 201]));
      pm.test("order starts PENDING", () => pm.expect(json.status).to.eql("PENDING"));
      { const v = (json.id); if (v !== undefined && v !== null) pm.collectionVariables.set('orderId', v); }
      { const v = (json.orderCode); if (v !== undefined && v !== null) pm.collectionVariables.set('orderCode', v); }
    language: text/javascript
order: 10000
