$kind: http-request
url: "{{baseUrl}}/api/customer/addresses"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{customerToken}}
body:
  type: json
  content: |-
    {
      "label": "Văn phòng",
      "receiverName": "Nguyễn Minh Anh",
      "receiverPhone": "0901001002",
      "addressLine": "1 Postman Street",
      "district": "Quận 1",
      "city": "TP.HCM",
      "latitude": 10.77,
      "longitude": 106.7,
      "isDefault": false
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Create address: HTTP 201', () => pm.expect(pm.response.code).to.be.oneOf([201]));
      pm.test("not default", () => pm.expect(json.isDefault).to.eql(false));
      { const v = (json.id); if (v !== undefined && v !== null) pm.collectionVariables.set('tmpAddressId', v); }
    language: text/javascript
order: 4000
