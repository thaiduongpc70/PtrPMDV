$kind: http-request
url: "{{baseUrl}}/api/customer/cart?restaurantId={{restaurantId}}"
method: GET
headers:
  Content-Type: application/json
  Authorization: Bearer {{customerToken}}
queryParams:
  restaurantId: "{{restaurantId}}"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Get cart: HTTP 200', () => pm.expect(pm.response.code).to.be.oneOf([200]));
      pm.test("cart has items", () => pm.expect(json.items && json.items.length >= 1).to.be.true);
    language: text/javascript
order: 9000
