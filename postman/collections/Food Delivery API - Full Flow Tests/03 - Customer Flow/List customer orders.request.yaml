$kind: http-request
url: "{{baseUrl}}/api/customer/orders"
method: GET
headers:
  Content-Type: application/json
  Authorization: Bearer {{customerToken}}
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('List customer orders: HTTP 200', () => pm.expect(pm.response.code).to.be.oneOf([200]));
      pm.test("new order listed", () => pm.expect((json.items || json).some(o => o.id === Number(pm.collectionVariables.get('orderId')))).to.be.true);
    language: text/javascript
order: 11000
