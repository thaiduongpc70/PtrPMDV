$kind: http-request
url: "{{baseUrl}}/api/shippers/profile"
method: GET
headers:
  Content-Type: application/json
  Authorization: Bearer {{shipperToken}}
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Shipper profile: HTTP 200', () => pm.expect(pm.response.code).to.be.oneOf([200]));
      pm.test("profile loaded", () => pm.expect(!!json.fullName).to.be.true);
      { const v = (json.id); if (v !== undefined && v !== null) pm.collectionVariables.set('shipperId', v); }
    language: text/javascript
order: 1000
