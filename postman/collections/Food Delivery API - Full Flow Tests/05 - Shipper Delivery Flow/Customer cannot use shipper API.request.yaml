$kind: http-request
url: "{{baseUrl}}/api/shippers/profile"
method: GET
headers:
  Content-Type: application/json
  Authorization: Bearer {{customerToken}}
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Customer cannot use shipper API: HTTP 403', () => pm.expect(pm.response.code).to.be.oneOf([403]));
    language: text/javascript
order: 15000
