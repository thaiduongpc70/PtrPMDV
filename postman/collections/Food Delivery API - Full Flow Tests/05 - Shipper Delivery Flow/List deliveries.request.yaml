$kind: http-request
url: "{{baseUrl}}/api/shippers/deliveries"
method: GET
headers:
  Content-Type: application/json
  Authorization: Bearer {{shipperToken}}
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('List deliveries: HTTP 200', () => pm.expect(pm.response.code).to.be.oneOf([200]));
      pm.test("delivery listed", () => pm.expect(json.items.some(d => d.id === Number(pm.collectionVariables.get('deliveryId')))).to.be.true);
    language: text/javascript
order: 6000
