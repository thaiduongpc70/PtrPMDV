$kind: http-request
url: "{{baseUrl}}/api/shippers/assignments"
method: GET
headers:
  Content-Type: application/json
  Authorization: Bearer {{shipperToken}}
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('List assignments: HTTP 200', () => pm.expect(pm.response.code).to.be.oneOf([200]));
      pm.test("assignment offered", () => pm.expect(json.items.some(a => a.id === Number(pm.collectionVariables.get('assignmentId')))).to.be.true);
    language: text/javascript
order: 4000
