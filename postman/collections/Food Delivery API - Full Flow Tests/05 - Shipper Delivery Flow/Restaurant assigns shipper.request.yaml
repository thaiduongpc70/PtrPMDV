$kind: http-request
url: "{{baseUrl}}/api/deliveries/assign"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{restaurantToken}}
body:
  type: json
  content: |-
    {
      "orderId": {{orderId}},
      "shipperId": {{shipperId}},
      "distanceKm": 3.5,
      "deliveryFee": 18000
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Restaurant assigns shipper: HTTP 201', () => pm.expect(pm.response.code).to.be.oneOf([201]));
      { const v = (json.assignmentId); if (v !== undefined && v !== null) pm.collectionVariables.set('assignmentId', v); }
      { const v = (json.deliveryId); if (v !== undefined && v !== null) pm.collectionVariables.set('deliveryId', v); }
    language: text/javascript
order: 3000
