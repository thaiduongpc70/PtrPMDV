$kind: http-request
url: "{{baseUrl}}/api/catalog/restaurant-categories"
method: GET
headers:
  Content-Type: application/json
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Public categories: HTTP 200', () => pm.expect(pm.response.code).to.be.oneOf([200]));
      pm.test("categories exist", () => pm.expect(json.items.length > 0).to.be.true);
    language: text/javascript
order: 14000
