$kind: http-request
url: "{{baseUrl}}/api/payments/orders/{{orderId2}}/cancel"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{customerToken}}
body:
  type: json
  content: |-
    {
      "reasonCode": "CUSTOMER_CHANGED_MIND",
      "reason": "Postman cancel test"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Customer cancels second order: HTTP 200', () => pm.expect(pm.response.code).to.be.oneOf([200]));
    language: text/javascript
order: 68000
