$kind: http-request
url: "{{baseUrl}}/api/communications/chat/sessions/{{chatSessionId}}/messages"
method: GET
headers:
  Content-Type: application/json
  Authorization: Bearer {{restaurantToken}}
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Restaurant reads chat: HTTP 200', () => pm.expect(pm.response.code).to.be.oneOf([200]));
      pm.test("message visible to restaurant", () => pm.expect(json.items.length >= 1).to.be.true);
    language: text/javascript
order: 43000
