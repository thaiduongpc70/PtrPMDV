$kind: http-request
url: "{{baseUrl}}/api/customer/addresses"
method: GET
headers:
  Content-Type: application/json
  Authorization: Bearer {{freshToken}}
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('New customer lists addresses: HTTP 200', () => pm.expect(pm.response.code).to.be.oneOf([200]));
      pm.test("exactly one address", () => pm.expect(json.items.length).to.eql(1));
    language: text/javascript
order: 13000
