$kind: http-request
url: "{{baseUrl}}/api/customer/addresses"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{freshToken}}
body:
  type: json
  content: |-
    {
      "label": "Nhà riêng",
      "receiverName": "E2E Postman",
      "receiverPhone": "0900000099",
      "addressLine": "10 Test Street",
      "district": "Quận 3",
      "city": "TP.HCM",
      "latitude": 10.78,
      "longitude": 106.69
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('New customer adds first address: HTTP 201', () => pm.expect(pm.response.code).to.be.oneOf([201]));
      pm.test("first address becomes default", () => pm.expect(json.isDefault).to.eql(true));
    language: text/javascript
order: 12000
