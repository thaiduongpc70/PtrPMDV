$kind: http-request
url: "{{baseUrl}}/api/auth/register/customer"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "{{regUser}}",
      "email": "{{regUser}}@example.vn",
      "phone": "{{regPhone}}",
      "password": "duong2k5",
      "fullName": "E2E Postman"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Duplicate registration rejected: HTTP 409', () => pm.expect(pm.response.code).to.be.oneOf([409]));
    language: text/javascript
order: 11000
