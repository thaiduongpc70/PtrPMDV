$kind: http-request
url: "{{baseUrl}}/api/communications/chat/sessions"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{customerToken}}
body:
  type: json
  content: |-
    {
      "orderId": {{orderId}}
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Open chat session: HTTP 200/201', () => pm.expect(pm.response.code).to.be.oneOf([200, 201]));
      { const v = (json.id); if (v !== undefined && v !== null) pm.collectionVariables.set('chatSessionId', v); }
    language: text/javascript
order: 41000
