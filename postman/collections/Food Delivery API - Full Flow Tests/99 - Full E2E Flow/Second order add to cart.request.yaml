$kind: http-request
url: "{{baseUrl}}/api/customer/cart/items"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{customerToken}}
body:
  type: json
  content: |-
    {
      "restaurantId": {{restaurantId}},
      "menuItemId": {{menuItemId}},
      "variantId": null,
      "quantity": 1,
      "toppingIds": []
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Second order: add to cart: HTTP 200/201', () => pm.expect(pm.response.code).to.be.oneOf([200, 201]));
    language: text/javascript
order: 66000
