$kind: http-request
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "emailOrUsername": "bao.shipper",
      "password": "duong2k5"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Login shipper: HTTP 200', () => pm.expect(pm.response.code).to.be.oneOf([200]));
      pm.test("role is SHIPPER", () => pm.expect(json.user.role).to.eql("SHIPPER"));
      pm.collectionVariables.set('shipperToken', json.accessToken);
    language: text/javascript
order: 5000
