$kind: http-request
url: "{{baseUrl}}/api/restaurant/manage/{{restaurantId}}/orders?q={{orderCode}}"
method: GET
headers:
  Content-Type: application/json
  Authorization: Bearer {{restaurantToken}}
queryParams:
  q: "{{orderCode}}"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Restaurant history finds the order: HTTP 200', () => pm.expect(pm.response.code).to.be.oneOf([200]));
      pm.test("delivered order found by code", () => pm.expect(json.items.length === 1 && json.items[0].status === "DELIVERED").to.be.true);
    language: text/javascript
order: 53000
