$kind: http-request
url: "{{baseUrl}}/api/customer/orders/{{orderId2}}"
method: GET
headers:
  Content-Type: application/json
  Authorization: Bearer {{customerToken}}
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Second order is cancelled: HTTP 200', () => pm.expect(pm.response.code).to.be.oneOf([200]));
      pm.test("order CANCELLED", () => pm.expect(json.status).to.eql("CANCELLED"));
    language: text/javascript
order: 69000
