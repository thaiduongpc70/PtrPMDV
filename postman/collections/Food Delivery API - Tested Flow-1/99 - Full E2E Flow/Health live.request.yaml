$kind: http-request
url: "{{baseUrl}}/health/live"
method: GET
headers:
  Content-Type: application/json
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Health live: HTTP 200', () => pm.expect(pm.response.code).to.be.oneOf([200]));
      pm.test("liveness ok", () => pm.expect(json.status).to.eql("ok"));
    language: text/javascript
order: 1000
