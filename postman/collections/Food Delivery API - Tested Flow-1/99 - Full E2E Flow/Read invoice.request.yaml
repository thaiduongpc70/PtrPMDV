$kind: http-request
url: "{{baseUrl}}/api/payments/invoices/{{orderCode}}"
method: GET
headers:
  Content-Type: application/json
  Authorization: Bearer {{customerToken}}
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Read invoice: HTTP 200', () => pm.expect(pm.response.code).to.be.oneOf([200]));
      pm.test("invoice has total", () => pm.expect(json.totalAmount > 0).to.be.true);
    language: text/javascript
order: 49000
