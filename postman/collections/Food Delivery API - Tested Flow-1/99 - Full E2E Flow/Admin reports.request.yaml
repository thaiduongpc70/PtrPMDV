$kind: http-request
url: "{{baseUrl}}/api/admin/manage/reports?days=7"
method: GET
headers:
  Content-Type: application/json
  Authorization: Bearer {{adminToken}}
queryParams:
  days: "7"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Admin reports: HTTP 200', () => pm.expect(pm.response.code).to.be.oneOf([200]));
      pm.test("delivery KPIs present", () => pm.expect(json.delivery.total >= 1).to.be.true);
    language: text/javascript
order: 60000
