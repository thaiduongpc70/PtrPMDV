$kind: http-request
url: "{{baseUrl}}/api/restaurant/manage/{{restaurantId}}/stats?days=7"
method: GET
headers:
  Content-Type: application/json
  Authorization: Bearer {{restaurantToken}}
queryParams:
  days: "7"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Restaurant stats include the order: HTTP 200', () => pm.expect(pm.response.code).to.be.oneOf([200]));
      pm.test("today has orders", () => pm.expect(json.today.orders >= 1).to.be.true);
    language: text/javascript
order: 52000
