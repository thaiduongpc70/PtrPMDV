$kind: http-request
url: "{{baseUrl}}/api/deliveries/order/{{orderId}}"
method: GET
headers:
  Content-Type: application/json
  Authorization: Bearer {{customerToken}}
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Customer sees delivery: HTTP 200', () => pm.expect(pm.response.code).to.be.oneOf([200]));
      pm.test("delivery ACCEPTED", () => pm.expect(json.status).to.eql("ACCEPTED"));
    language: text/javascript
order: 37000
