$kind: http-request
url: "{{baseUrl}}/api/deliveries/available-shippers"
method: GET
headers:
  Content-Type: application/json
  Authorization: Bearer {{restaurantToken}}
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Restaurant lists available shippers: HTTP 200', () => pm.expect(pm.response.code).to.be.oneOf([200]));
      pm.test("a shipper is available", () => pm.expect(json.items.length > 0).to.be.true);
      { const v = (json.items[0]?.id); if (v !== undefined && v !== null) pm.collectionVariables.set('shipperId', v); }
    language: text/javascript
order: 33000
