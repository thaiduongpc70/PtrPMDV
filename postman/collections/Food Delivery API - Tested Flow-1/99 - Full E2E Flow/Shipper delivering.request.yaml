$kind: http-request
url: "{{baseUrl}}/api/shippers/deliveries/{{deliveryId}}/status"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{shipperToken}}
body:
  type: json
  content: |-
    {
      "status": "DELIVERING",
      "note": "Postman"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Shipper delivering: HTTP 200', () => pm.expect(pm.response.code).to.be.oneOf([200]));
    language: text/javascript
order: 45000
