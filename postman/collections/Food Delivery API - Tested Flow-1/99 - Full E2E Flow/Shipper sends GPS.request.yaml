$kind: http-request
url: "{{baseUrl}}/api/shippers/locations"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{shipperToken}}
body:
  type: json
  content: |-
    {
      "deliveryId": {{deliveryId}},
      "latitude": 10.7769,
      "longitude": 106.7009,
      "speed": 24
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Shipper sends GPS: HTTP 201', () => pm.expect(pm.response.code).to.be.oneOf([201]));
    language: text/javascript
order: 38000
