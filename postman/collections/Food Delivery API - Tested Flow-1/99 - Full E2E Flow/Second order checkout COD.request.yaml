$kind: http-request
url: "{{baseUrl}}/api/customer/orders/checkout"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{customerToken}}
  Idempotency-Key: "{{idemKey2}}"
body:
  type: json
  content: |-
    {
      "restaurantId": {{restaurantId}},
      "addressId": {{addressId}},
      "paymentMethod": "COD"
    }
auth:
  type: noauth
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set('idemKey2', 'postman-cod-' + Date.now());
    language: text/javascript
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Second order: checkout COD: HTTP 200/201', () => pm.expect(pm.response.code).to.be.oneOf([200, 201]));
      { const v = (json.id); if (v !== undefined && v !== null) pm.collectionVariables.set('orderId2', v); }
    language: text/javascript
order: 67000
