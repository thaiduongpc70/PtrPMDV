$kind: http-request
url: "{{baseUrl}}/api/admin/partners/applications?type=RESTAURANT"
method: GET
headers:
  Content-Type: application/json
  Authorization: Bearer {{adminToken}}
queryParams:
  type: RESTAURANT
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Admin filters by type: HTTP 200', () => pm.expect(pm.response.code).to.be.oneOf([200]));
      pm.test("only restaurant applications", () => pm.expect(json.items.every(a => a.type === "RESTAURANT")).to.be.true);
    language: text/javascript
order: 12000
