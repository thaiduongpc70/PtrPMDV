$kind: http-request
url: "{{baseUrl}}/api/customer/addresses"
method: GET
headers:
  Content-Type: application/json
  Authorization: Bearer {{customerToken}}
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Header shows new default: HTTP 200', () => pm.expect(pm.response.code).to.be.oneOf([200]));
      pm.test("new address is the default", () => pm.expect(json.items.find(a => a.isDefault)?.id).to.eql(Number(pm.collectionVariables.get('tmpAddressId'))));
    language: text/javascript
order: 6000
