$kind: http-request
url: "{{baseUrl}}/api/customer/addresses/{{tmpAddressId}}"
method: GET
headers:
  Content-Type: application/json
  Authorization: Bearer {{customerToken}}
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Get address: HTTP 200', () => pm.expect(pm.response.code).to.be.oneOf([200]));
      pm.test("address line matches", () => pm.expect(json.addressLine).to.eql("1 Postman Street"));
    language: text/javascript
order: 3000
