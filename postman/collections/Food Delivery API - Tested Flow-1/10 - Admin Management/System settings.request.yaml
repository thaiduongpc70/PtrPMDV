$kind: http-request
url: "{{baseUrl}}/api/admin/system-settings"
method: GET
headers:
  Content-Type: application/json
  Authorization: Bearer {{adminToken}}
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('System settings: HTTP 200', () => pm.expect(pm.response.code).to.be.oneOf([200]));
      pm.test("has items", () => pm.expect(json.items !== undefined).to.be.true);
    language: text/javascript
order: 20000
