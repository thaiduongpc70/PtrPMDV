$kind: http-request
url: "{{baseUrl}}/api/admin/manage/shippers"
method: GET
headers:
  Content-Type: application/json
  Authorization: Bearer {{adminToken}}
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Shippers list: HTTP 200', () => pm.expect(pm.response.code).to.be.oneOf([200]));
      { const v = (json.items[0]?.id); if (v !== undefined && v !== null) pm.collectionVariables.set('adminShipperId', v); }
    language: text/javascript
order: 5000
