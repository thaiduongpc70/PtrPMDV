$kind: http-request
url: "{{baseUrl}}/api/admin/export/orders?format=csv"
method: GET
headers:
  Content-Type: application/json
  Authorization: Bearer {{adminToken}}
queryParams:
  format: csv
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Admin export orders as CSV: HTTP 200', () => pm.expect(pm.response.code).to.be.oneOf([200]));
      pm.test("content-type is CSV", () => pm.expect(pm.response.headers.get("Content-Type").includes("text/csv")).to.be.true);
      pm.test("is an attachment", () => pm.expect(pm.response.headers.get("Content-Disposition").includes("attachment")).to.be.true);
      pm.test("starts with UTF-8 BOM (Excel-safe)", () => pm.expect(pm.response.stream[0] === 0xEF && pm.response.stream[1] === 0xBB && pm.response.stream[2] === 0xBF).to.be.true);
      pm.test("Vietnamese header row", () => pm.expect(pm.response.text().split("\r\n")[0].includes("Mã đơn")).to.be.true);
    language: text/javascript
order: 11000
