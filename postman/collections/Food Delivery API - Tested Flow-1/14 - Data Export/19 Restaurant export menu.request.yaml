$kind: http-request
url: "{{baseUrl}}/api/restaurant/export/{{ownRestaurantId}}/menu"
method: GET
headers:
  Content-Type: application/json
  Authorization: Bearer {{restaurantToken}}
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Restaurant export menu: HTTP 200', () => pm.expect(pm.response.code).to.be.oneOf([200]));
      pm.test("has columns + rows", () => pm.expect(Array.isArray(json.columns) && Array.isArray(json.rows)).to.be.true);
    language: text/javascript
order: 19000
