$kind: http-request
url: "{{baseUrl}}/api/payments/wallet"
method: GET
headers:
  Content-Type: "application/json"
  Authorization: "Bearer {{customerToken}}"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Wallet balance increased: HTTP 200', () => pm.expect(pm.response.code).to.be.oneOf([200]));
      pm.test("balance +100.000", () => pm.expect(json.wallet.balance === Number(pm.collectionVariables.get('walletBefore')) + 100000).to.be.true);
    language: text/javascript
order: 8000
