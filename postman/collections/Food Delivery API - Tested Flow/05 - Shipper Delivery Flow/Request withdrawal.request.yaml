$kind: http-request
url: "{{baseUrl}}/api/shippers/withdrawals"
method: POST
headers:
  Content-Type: "application/json"
  Authorization: "Bearer {{shipperToken}}"
body:
  type: text
  content: |-
    {
      "amount": 50000,
      "bankName": "VCB",
      "bankAccount": "0123456789",
      "accountHolder": "NGUYEN VAN A"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Request withdrawal: HTTP 200/201', () => pm.expect(pm.response.code).to.be.oneOf([200, 201]));
    language: text/javascript
order: 14000
