$kind: http-request
url: "{{baseUrl}}/api/deliveries/{{deliveryId}}/locations"
method: GET
headers:
  Content-Type: "application/json"
  Authorization: "Bearer {{customerToken}}"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Customer sees tracking points: HTTP 200', () => pm.expect(pm.response.code).to.be.oneOf([200]));
      pm.test("GPS point stored", () => pm.expect(json.totalItems >= 1).to.be.true);
    language: text/javascript
order: 8000
