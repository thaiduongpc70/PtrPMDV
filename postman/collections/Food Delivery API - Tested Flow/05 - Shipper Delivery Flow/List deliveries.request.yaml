$kind: http-request
url: "{{baseUrl}}/api/shippers/deliveries"
method: GET
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.json();
      const first = json.items?.[0];
      if (first?.id) pm.collectionVariables.set('deliveryId', first.id);
    language: text/javascript
order: 5000
