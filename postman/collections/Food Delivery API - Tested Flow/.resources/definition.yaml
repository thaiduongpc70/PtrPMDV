$kind: collection
description: "Collection tổng hợp các API chính để test hệ thống Food Delivery: auth, customer, restaurant, shipper, admin, payment, chat/support và settlement. Import vào Postman, tạo environment hoặc dùng collection variables có sẵn."
variables:
  baseUrl: http://localhost:3002
  accessToken: ""
  refreshToken: ""
  userId: ""
  restaurantId: "1"
  menuItemId: "1"
  variantId: ""
  toppingId: ""
  addressId: "1"
  orderId: "1"
  orderCode: ""
  shipperId: "1"
  assignmentId: "1"
  deliveryId: "1"
  paymentId: "1"
  codId: "1"
  chatSessionId: "1"
  ticketId: "1"
  currentRole: ""
  customerToken: ""
  restaurantToken: ""
  shipperToken: ""
  adminToken: ""
  freshToken: ""
  customerRefresh: ""
  tmpAddressId: ""
  adminOrderId: ""
  adminShipperId: ""
  promoId: ""
  promoCode: ""
  zoneId: ""
  orderId2: ""
  reviewId: ""
  hoursJson: ""
  idemKey: ""
  idemKey2: ""
  regUser: ""
  regPhone: ""
auth:
  - id: bb527b84-7295-4bc2-a7b6-536de57e710f
    type: bearer
    name: bearer auth
    credentials:
      token: "{{accessToken}}"
scripts:
  - type: beforeRequest
    code: |-
      // Auto-login: if the request uses {{customerToken}} / {{restaurantToken}} / {{shipperToken}} / {{adminToken}}
      // and that variable is empty, log in with the demo account of that role first.
      const accounts = { customerToken: 'minh.anh', restaurantToken: 'bep.annhien', shipperToken: 'bao.shipper', adminToken: 'thaiduongpc7' };
      const header = pm.request.headers.get('Authorization') || '';
      const match = header.match(/\{\{(customerToken|restaurantToken|shipperToken|adminToken)\}\}/);
      if (match && !pm.collectionVariables.get(match[1])) {
        pm.sendRequest({
          url: pm.variables.get('baseUrl') + '/api/auth/login',
          method: 'POST',
          header: { 'Content-Type': 'application/json' },
          body: { mode: 'raw', raw: JSON.stringify({ emailOrUsername: accounts[match[1]], password: 'duong2k5' }) }
        }, (error, response) => {
          if (!error && response.code === 200) pm.collectionVariables.set(match[1], response.json().accessToken);
        });
      }
    language: text/javascript
