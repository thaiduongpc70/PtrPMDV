$kind: http-request
url: "{{baseUrl}}/api/catalog/restaurants?keyword=com&page=1&pageSize=20"
method: GET
queryParams:
  keyword: com
  page: "1"
  pageSize: "20"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.json();
      const first = json.items?.[0];
      if (first?.id) pm.collectionVariables.set('restaurantId', first.id);
    language: text/javascript
order: 3000
