$kind: http-request
url: "{{baseUrl}}/api/catalog/menu-items?sort=featured&page=1&pageSize=20"
method: GET
headers:
  Content-Type: "application/json"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Search menu items: HTTP 200', () => pm.expect(pm.response.code).to.be.oneOf([200]));
      pm.test("menu items exist", () => pm.expect(json.items.length > 0).to.be.true);
      pm.test("menu items carry rating fields", () => pm.expect(json.items[0]).to.include.all.keys('rating', 'totalReviews'));
      pm.collectionVariables.set('publicMenuItemId', json.items[0].id);
    language: text/javascript
order: 5000
