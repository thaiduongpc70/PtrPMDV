$kind: http-request
url: "{{baseUrl}}/api/does-not-exist"
method: GET
headers:
  Content-Type: "application/json"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Unknown route returns 404: HTTP 404', () => pm.expect(pm.response.code).to.be.oneOf([404]));
    language: text/javascript
order: 4000
