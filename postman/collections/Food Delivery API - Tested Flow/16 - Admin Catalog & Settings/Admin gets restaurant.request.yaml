$kind: http-request
url: "{{baseUrl}}/api/admin/restaurants/{{pmNewRid}}"
method: GET
headers:
  Authorization: Bearer {{adminToken}}
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const j = (() => { try { return pm.response.json(); } catch (e) { return null; } })();
      pm.test("Admin gets restaurant: HTTP 200", () => pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([200]));
      pm.test("Admin gets restaurant: nội dung", () => { pm.expect(j.name || j.restaurant.name).to.include('Quán PM'); });
    language: text/javascript
order: 5000
