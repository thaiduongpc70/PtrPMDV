$kind: http-request
url: "{{baseUrl}}/api/admin/manage/settlements/{{pmSettlementId}}"
method: PATCH
headers:
  Content-Type: application/json
  Authorization: Bearer {{adminToken}}
body:
  type: text
  content: '{"status":"PROCESSING"}'
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const j = (() => { try { return pm.response.json(); } catch (e) { return null; } })();
      pm.test("Admin marks settlement processing: HTTP 200", () => pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([200]));
      pm.test("Admin marks settlement processing: nội dung", () => { pm.expect(j.status).to.eql('PROCESSING'); });
    language: text/javascript
order: 32000
