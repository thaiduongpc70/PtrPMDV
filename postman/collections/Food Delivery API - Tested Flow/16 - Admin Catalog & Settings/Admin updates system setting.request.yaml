$kind: http-request
url: "{{baseUrl}}/api/admin/system-settings/postman.test"
method: PUT
headers:
  Content-Type: application/json
  Authorization: Bearer {{adminToken}}
body:
  type: text
  content: '{"value":"ok","description":"khoá thử của Postman"}'
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const j = (() => { try { return pm.response.json(); } catch (e) { return null; } })();
      pm.test("Admin updates system setting: HTTP 200", () => pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([200]));
      pm.test("Admin updates system setting: nội dung", () => { pm.expect(j.value).to.eql('ok'); });
    language: text/javascript
order: 13000
