$kind: http-request
url: "{{baseUrl}}/api/docs"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const j = (() => { try { return pm.response.json(); } catch (e) { return null; } })();
      pm.test("Swagger UI page: HTTP 200", () => pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([200]));
      pm.test("Swagger UI page: nội dung", () => { pm.expect(pm.response.text()).to.match(/swagger/i); });
    language: text/javascript
order: 34000
