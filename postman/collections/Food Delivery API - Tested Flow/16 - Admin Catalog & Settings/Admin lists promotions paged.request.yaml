$kind: http-request
url: "{{baseUrl}}/api/admin/manage/promotions?pageSize=3"
method: GET
headers:
  Authorization: Bearer {{adminToken}}
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const j = (() => { try { return pm.response.json(); } catch (e) { return null; } })();
      pm.test("Admin lists promotions paged: HTTP 200", () => pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([200]));
      pm.test("Admin lists promotions paged: nội dung", () => { pm.expect(j.items).to.have.length.at.most(3); pm.expect(j.pagination.totalItems).to.be.above(0); });
    language: text/javascript
order: 22000
