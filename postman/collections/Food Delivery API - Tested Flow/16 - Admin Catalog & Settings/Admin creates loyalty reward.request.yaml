$kind: http-request
url: "{{baseUrl}}/api/admin/manage/loyalty-rewards"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{adminToken}}
body:
  type: text
  content: '{"name":"Quà PM {{pmStamp}}","pointsCost":1,"discountType":"FIXED_AMOUNT","discountValue":5000,"validDays":7,"stock":5}'
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const j = (() => { try { return pm.response.json(); } catch (e) { return null; } })();
      pm.test("Admin creates loyalty reward: HTTP 201", () => pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([201]));
      pm.test("Admin creates loyalty reward: nội dung", () => { pm.collectionVariables.set('pmRewardId', String(j.id)); });
    language: text/javascript
order: 16000
