$kind: http-request
url: "{{baseUrl}}/api/admin/restaurants/{{pmNewRid}}"
method: PATCH
headers:
  Content-Type: application/json
  Authorization: Bearer {{adminToken}}
body:
  type: text
  content: '{"description":"mô tả admin"}'
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const j = (() => { try { return pm.response.json(); } catch (e) { return null; } })();
      pm.test("Admin updates restaurant: HTTP 200", () => pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([200]));
      pm.test("Admin updates restaurant: nội dung", () => { pm.expect(j.description).to.eql('mô tả admin'); });
    language: text/javascript
order: 6000
