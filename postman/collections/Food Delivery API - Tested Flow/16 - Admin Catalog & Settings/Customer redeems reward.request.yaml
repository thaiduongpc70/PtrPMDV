$kind: http-request
url: "{{baseUrl}}/api/customer/loyalty/rewards/{{pmRewardId}}/redeem"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{customerToken}}
body:
  type: text
  content: "{}"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const j = (() => { try { return pm.response.json(); } catch (e) { return null; } })();
      pm.test("Customer redeems reward: HTTP 200/201", () => pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([200,201]));
      pm.test("Customer redeems reward: nội dung", () => { pm.expect(j).to.have.property('code'); });
    language: text/javascript
order: 18000
