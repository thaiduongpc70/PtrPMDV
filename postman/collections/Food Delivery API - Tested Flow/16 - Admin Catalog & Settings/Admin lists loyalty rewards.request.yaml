$kind: http-request
url: "{{baseUrl}}/api/admin/manage/loyalty-rewards"
method: GET
headers:
  Authorization: Bearer {{adminToken}}
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const j = (() => { try { return pm.response.json(); } catch (e) { return null; } })();
      pm.test("Admin lists loyalty rewards: HTTP 200", () => pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([200]));
      pm.test("Admin lists loyalty rewards: nội dung", () => { pm.expect(j.items.map(x => String(x.id))).to.include(pm.collectionVariables.get('pmRewardId')); });
    language: text/javascript
order: 17000
