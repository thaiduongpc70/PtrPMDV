$kind: http-request
url: "{{baseUrl}}/api/admin/manage/promotions/{{pmSysPromoId}}/extend"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{adminToken}}
body:
  type: text
  content: '{"days":10}'
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const j = (() => { try { return pm.response.json(); } catch (e) { return null; } })();
      pm.test("Admin extends platform voucher: HTTP 200", () => pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([200]));
      pm.test("Admin extends platform voucher: nội dung", () => { pm.expect(j.extendedDays).to.eql(10); });
    language: text/javascript
order: 24000
