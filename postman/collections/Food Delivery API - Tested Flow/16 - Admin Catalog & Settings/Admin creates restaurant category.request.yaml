$kind: http-request
url: "{{baseUrl}}/api/admin/restaurant-categories"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{adminToken}}
body:
  type: text
  content: '{"name":"Danh mục PM {{pmStamp}}"}'
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const j = (() => { try { return pm.response.json(); } catch (e) { return null; } })();
      pm.test("Admin creates restaurant category: HTTP 201", () => pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([201]));
      pm.test("Admin creates restaurant category: nội dung", () => { pm.collectionVariables.set('pmRcatId', String((j.id || j.category.id))); });
    language: text/javascript
order: 2000
