$kind: http-request
url: "{{baseUrl}}/api/admin/banners/{{pmBannerId}}"
method: PATCH
headers:
  Content-Type: application/json
  Authorization: Bearer {{adminToken}}
body:
  type: text
  content: '{"title":"Banner PM sửa"}'
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const j = (() => { try { return pm.response.json(); } catch (e) { return null; } })();
      pm.test("Admin updates banner: HTTP 200", () => pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([200]));
      pm.test("Admin updates banner: nội dung", () => { pm.expect(j.title).to.eql('Banner PM sửa'); pm.expect(j.status).to.eql('INACTIVE'); });
    language: text/javascript
order: 27000
