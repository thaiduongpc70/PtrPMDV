$kind: http-request
url: "{{baseUrl}}/api/accounts/admin/users?search=bep.annhien"
method: GET
headers:
  Authorization: Bearer {{adminToken}}
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const j = (() => { try { return pm.response.json(); } catch (e) { return null; } })();
      pm.test("Admin finds owner account: HTTP 200", () => pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([200]));
      pm.test("Admin finds owner account: nội dung", () => { pm.expect(j.items).to.be.an('array').that.is.not.empty; pm.expect(j.items[0].username).to.eql('bep.annhien'); pm.collectionVariables.set('pmOwnerId', String(j.items[0].id)); });
    language: text/javascript
order: 1000
