$kind: http-request
url: "{{baseUrl}}/api/admin/manage/reviews/{{pmReviewId}}"
method: DELETE
headers:
  Authorization: Bearer {{adminToken}}
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const j = (() => { try { return pm.response.json(); } catch (e) { return null; } })();
      pm.test("Admin hides review: HTTP 200", () => pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([200]));
      pm.test("Admin hides review: nội dung", () => { pm.expect(j.deleted).to.eql(true); });
    language: text/javascript
order: 30000
