$kind: http-request
url: "{{baseUrl}}/api/shippers/assignments/{{pmAssignId}}/reject"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{shipperToken}}
body:
  type: text
  content: '{"reason":"Đang bận (Postman)"}'
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const j = (() => { try { return pm.response.json(); } catch (e) { return null; } })();
      pm.test("Shipper rejects assignment: HTTP 200", () => pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([200]));
      pm.test("Shipper rejects assignment: nội dung", () => { pm.expect(j.status).to.eql('REJECTED'); pm.expect(String(j.id)).to.eql(pm.collectionVariables.get('pmAssignId')); });
    language: text/javascript
order: 38000
