$kind: http-request
url: "{{baseUrl}}/api/admin/manage/refunds"
method: GET
headers:
  Authorization: Bearer {{shipperToken}}
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const j = (() => { try { return pm.response.json(); } catch (e) { return null; } })();
      pm.test("Shipper forbidden on refunds: HTTP 403", () => pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([403]));
      pm.test("Shipper forbidden on refunds: nội dung", () => { pm.expect(j.message).to.be.a('string').that.is.not.empty; });
    language: text/javascript
order: 53000
