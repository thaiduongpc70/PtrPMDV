$kind: http-request
url: "{{baseUrl}}/api/shippers/deliveries/{{pmDeliveryId}}/status"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{shipperToken}}
body:
  type: text
  content: '{"status":"DELIVERED"}'
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const j = (() => { try { return pm.response.json(); } catch (e) { return null; } })();
      pm.test("Cannot deliver before pickup: HTTP 409", () => pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([409]));
      pm.test("Cannot deliver before pickup: nội dung", () => { pm.expect(j.message).to.include('Không thể chuyển'); });
    language: text/javascript
order: 37000
