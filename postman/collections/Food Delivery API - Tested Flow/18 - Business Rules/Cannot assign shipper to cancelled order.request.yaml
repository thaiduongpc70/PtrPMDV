$kind: http-request
url: "{{baseUrl}}/api/deliveries/assign"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{adminToken}}
body:
  type: text
  content: '{"orderId":{{pmOrder2}},"shipperId":{{pmShipperId}}}'
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const j = (() => { try { return pm.response.json(); } catch (e) { return null; } })();
      pm.test("Cannot assign shipper to cancelled order: HTTP 409", () => pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([409]));
      pm.test("Cannot assign shipper to cancelled order: nội dung", () => { pm.expect(j.message).to.include('chỉ phân công'); });
    language: text/javascript
order: 32000
