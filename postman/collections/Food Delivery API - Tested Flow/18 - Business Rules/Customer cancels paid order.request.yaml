$kind: http-request
url: "{{baseUrl}}/api/payments/orders/{{pmOrderId}}/cancel"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{newToken}}
body:
  type: text
  content: '{"reason":"Đổi ý (Postman)"}'
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const j = (() => { try { return pm.response.json(); } catch (e) { return null; } })();
      pm.test("Customer cancels paid order: HTTP 200", () => pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([200]));
      pm.test("Customer cancels paid order: nội dung", () => { pm.expect(j.refundAmount).to.eql(Number(pm.collectionVariables.get('pmTotal')) - Number(pm.collectionVariables.get('pmPart'))); });
    language: text/javascript
order: 17000
