$kind: http-request
url: "{{baseUrl}}/api/notifications"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const j = (() => { try { return pm.response.json(); } catch (e) { return null; } })();
      pm.test("Anonymous unauthorized: HTTP 401", () => pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([401]));
      pm.test("Anonymous unauthorized: nội dung", () => { pm.expect(j.message).to.be.a('string').that.is.not.empty; });
    language: text/javascript
order: 55000
