$kind: http-request
url: "{{baseUrl}}/api/deliveries/reviews"
method: GET
headers:
  Authorization: Bearer {{newToken}}
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const j = (() => { try { return pm.response.json(); } catch (e) { return null; } })();
      pm.test("Driver reviews forbidden for customer: HTTP 403", () => pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([403]));
      pm.test("Driver reviews forbidden for customer: nội dung", () => { pm.expect(j.message).to.be.a('string').that.is.not.empty; });
    language: text/javascript
order: 51000
