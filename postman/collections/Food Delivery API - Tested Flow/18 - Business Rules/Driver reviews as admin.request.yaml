$kind: http-request
url: "{{baseUrl}}/api/deliveries/reviews?limit=5"
method: GET
headers:
  Authorization: Bearer {{adminToken}}
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const j = (() => { try { return pm.response.json(); } catch (e) { return null; } })();
      pm.test("Driver reviews as admin: HTTP 200", () => pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([200]));
      pm.test("Driver reviews as admin: nội dung", () => { pm.expect(j.items).to.have.length.at.most(5); pm.expect(j.total).to.be.above(0); });
    language: text/javascript
order: 49000
