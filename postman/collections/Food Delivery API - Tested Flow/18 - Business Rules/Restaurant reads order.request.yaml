$kind: http-request
url: "{{baseUrl}}/api/restaurant/orders/{{pmOrder2}}"
method: GET
headers:
  Authorization: Bearer {{restaurantToken}}
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const j = (() => { try { return pm.response.json(); } catch (e) { return null; } })();
      pm.test("Restaurant reads order: HTTP 200", () => pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([200]));
      pm.test("Restaurant reads order: nội dung", () => { pm.expect(String(j.id)).to.eql(pm.collectionVariables.get('pmOrder2')); });
    language: text/javascript
order: 24000
