$kind: http-request
url: "{{baseUrl}}/api/notifications?page=0"
method: GET
headers:
  Authorization: Bearer {{adminToken}}
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const j = (() => { try { return pm.response.json(); } catch (e) { return null; } })();
      pm.test("Pagination 400: notifications page zero: HTTP 400", () => pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([400]));
      pm.test("Pagination 400: notifications page zero: nội dung", () => { pm.expect(j.message).to.match(/không hợp lệ|vượt/); });
    language: text/javascript
order: 48000
