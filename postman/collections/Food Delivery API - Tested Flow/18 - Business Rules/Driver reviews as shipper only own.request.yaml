$kind: http-request
url: "{{baseUrl}}/api/deliveries/reviews?limit=50"
method: GET
headers:
  Authorization: Bearer {{shipperToken}}
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const j = (() => { try { return pm.response.json(); } catch (e) { return null; } })();
      pm.test("Driver reviews as shipper only own: HTTP 200", () => pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([200]));
      pm.test("Driver reviews as shipper only own: nội dung", () => { pm.expect(j.items).to.not.be.empty; pm.expect(j.items.every(x => String(x.shipperId) === pm.collectionVariables.get('pmShipperId'))).to.eql(true); });
    language: text/javascript
order: 50000
