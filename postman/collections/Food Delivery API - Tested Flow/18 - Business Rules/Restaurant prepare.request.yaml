$kind: http-request
url: "{{baseUrl}}/api/restaurant/orders/{{pmOrder3}}/prepare"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{restaurantToken}}
body:
  type: text
  content: "{}"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const j = (() => { try { return pm.response.json(); } catch (e) { return null; } })();
      pm.test("Restaurant prepare: HTTP 200", () => pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([200]));
      pm.test("Restaurant prepare: nội dung", () => { pm.expect(j.status).to.eql('PREPARING'); pm.expect(String(j.id)).to.eql(pm.collectionVariables.get('pmOrder3')); });
    language: text/javascript
order: 34000
