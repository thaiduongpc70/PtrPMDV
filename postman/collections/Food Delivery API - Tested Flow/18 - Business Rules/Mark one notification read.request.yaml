$kind: http-request
url: "{{baseUrl}}/api/notifications/{{pmNotifId}}/read"
method: PATCH
headers:
  Content-Type: application/json
  Authorization: Bearer {{shipperToken}}
body:
  type: text
  content: "{}"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const j = (() => { try { return pm.response.json(); } catch (e) { return null; } })();
      pm.test("Mark one notification read: HTTP 200", () => pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([200]));
      pm.test("Mark one notification read: nội dung", () => { pm.expect(j.marked).to.eql(true); });
    language: text/javascript
order: 40000
