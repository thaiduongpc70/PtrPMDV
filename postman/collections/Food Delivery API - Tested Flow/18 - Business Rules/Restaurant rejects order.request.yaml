$kind: http-request
url: "{{baseUrl}}/api/restaurant/orders/{{pmOrder2}}/reject"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{restaurantToken}}
body:
  type: text
  content: '{"note":"Hết nguyên liệu"}'
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const j = (() => { try { return pm.response.json(); } catch (e) { return null; } })();
      pm.test("Restaurant rejects order: HTTP 200", () => pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([200]));
      pm.test("Restaurant rejects order: nội dung", () => { pm.expect(JSON.stringify(j)).to.include('CANCELLED'); });
    language: text/javascript
order: 25000
