$kind: http-request
url: "{{baseUrl}}/api/customer/orders/{{pmOrderId}}"
method: GET
headers:
  Authorization: Bearer {{newToken}}
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const j = (() => { try { return pm.response.json(); } catch (e) { return null; } })();
      pm.test("Order fully refunded: HTTP 200", () => pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([200]));
      pm.test("Order fully refunded: nội dung", () => { pm.expect(j.paymentStatus).to.eql('REFUNDED'); pm.expect(j.status).to.eql('CANCELLED'); });
    language: text/javascript
order: 20000
