$kind: http-request
url: "{{baseUrl}}/api/notifications?pageSize=20"
method: GET
headers:
  Authorization: Bearer {{shipperToken}}
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const j = (() => { try { return pm.response.json(); } catch (e) { return null; } })();
      pm.test("Shipper gets assignment notification: HTTP 200", () => pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([200]));
      pm.test("Shipper gets assignment notification: nội dung", () => { pm.expect(j.items.some(n => n.title === 'Bạn được giao đơn mới')).to.eql(true); pm.collectionVariables.set('pmNotifId', String(j.items[0].id)); });
    language: text/javascript
order: 39000
