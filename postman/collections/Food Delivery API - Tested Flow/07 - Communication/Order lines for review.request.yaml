$kind: http-request
url: "{{baseUrl}}/api/customer/orders/{{orderId}}"
method: GET
headers:
  Content-Type: "application/json"
  Authorization: "Bearer {{customerToken}}"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Order detail: HTTP 200', () => pm.expect(pm.response.code).to.be.oneOf([200]));
      pm.test("order has lines", () => pm.expect(json.items.length >= 1).to.be.true);
      pm.collectionVariables.set('orderItemId', json.items[0].id);
      pm.collectionVariables.set('reviewedMenuItemId', json.items[0].menuItemId);
    language: text/javascript
order: 7100
