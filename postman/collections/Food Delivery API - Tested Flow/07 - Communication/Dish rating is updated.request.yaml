$kind: http-request
url: "{{baseUrl}}/api/catalog/menu-items/{{reviewedMenuItemId}}/reviews?pageSize=50"
method: GET
headers:
  Content-Type: "application/json"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Dish reviews: HTTP 200', () => pm.expect(pm.response.code).to.be.oneOf([200]));
      pm.test("new review is listed", () => pm.expect(json.items.some(r => r.orderId === Number(pm.collectionVariables.get('orderId')) && r.rating === 4)).to.be.true);
      pm.test("counts match distribution", () => pm.expect(Object.values(json.summary.distribution).reduce((a, b) => a + b, 0)).to.eql(json.summary.total));
    language: text/javascript
order: 7500
