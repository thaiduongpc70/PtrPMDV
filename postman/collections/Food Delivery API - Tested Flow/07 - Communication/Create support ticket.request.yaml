$kind: http-request
url: "{{baseUrl}}/api/communications/support/tickets"
method: POST
headers:
  Content-Type: "application/json"
  Authorization: "Bearer {{customerToken}}"
body:
  type: text
  content: |-
    {
      "orderId": {{orderId}},
      "subject": "Cần hỗ trợ đơn hàng",
      "description": "Tôi muốn kiểm tra trạng thái giao hàng.",
      "category": "ORDER"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Create support ticket: HTTP 201', () => pm.expect(pm.response.code).to.be.oneOf([201]));
      { const v = (json.id); if (v !== undefined && v !== null) pm.collectionVariables.set('ticketId', v); }
    language: text/javascript
order: 4000
