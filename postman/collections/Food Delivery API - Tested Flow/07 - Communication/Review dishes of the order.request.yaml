$kind: http-request
url: "{{baseUrl}}/api/communications/orders/{{orderId}}/item-reviews"
method: POST
headers:
  Content-Type: "application/json"
  Authorization: "Bearer {{customerToken}}"
body:
  type: text
  content: |-
    {
      "items": [
        { "orderItemId": {{orderItemId}}, "rating": 4, "comment": "Món ngon, đóng gói kỹ." }
      ]
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Review dishes: HTTP 201', () => pm.expect(pm.response.code).to.be.oneOf([201]));
      pm.test("one review stored", () => pm.expect(json.totalItems).to.eql(1));
    language: text/javascript
order: 7200
