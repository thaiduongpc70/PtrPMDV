$kind: http-request
url: "{{baseUrl}}/api/communications/orders/{{orderId}}/shipper-review"
method: POST
headers:
  Content-Type: "application/json"
  Authorization: "Bearer {{customerToken}}"
body:
  type: text
  content: |-
    {
      "rating": 5,
      "comment": "Tài xế thân thiện."
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Review shipper: HTTP 200/201', () => pm.expect(pm.response.code).to.be.oneOf([200, 201]));
    language: text/javascript
order: 7000
