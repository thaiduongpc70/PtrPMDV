$kind: http-request
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: '{"emailOrUsername":"pm{{pmStamp}}@example.com","password":"Matkhau#67890"}'
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const j = (() => { try { return pm.response.json(); } catch (e) { return null; } })();
      pm.test("Login with new password: HTTP 200", () => pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([200]));
      pm.test("Login with new password: nội dung", () => { pm.collectionVariables.set('newToken', String(j.accessToken)); });
    language: text/javascript
order: 17000
