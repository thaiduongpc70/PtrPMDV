$kind: http-request
url: "{{baseUrl}}/api/auth/email/verification/request"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: '{"email":"pm{{pmStamp}}@example.com"}'
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const j = (() => { try { return pm.response.json(); } catch (e) { return null; } })();
      pm.test("Request email verification: HTTP 200", () => pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([200]));
      pm.test("Request email verification: nội dung", () => { pm.expect(j.verificationToken).to.be.a('string'); pm.collectionVariables.set('pmVerify', j.verificationToken); });
    language: text/javascript
order: 11000
