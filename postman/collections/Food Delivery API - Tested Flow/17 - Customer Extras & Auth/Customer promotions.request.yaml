$kind: http-request
url: "{{baseUrl}}/api/customer/promotions"
method: GET
headers:
  Authorization: Bearer {{newToken}}
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const j = (() => { try { return pm.response.json(); } catch (e) { return null; } })();
      pm.test("Customer promotions: HTTP 200", () => pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([200]));
      pm.test("Customer promotions: nội dung", () => { pm.expect(j.items).to.be.an('array'); });
    language: text/javascript
order: 23000
