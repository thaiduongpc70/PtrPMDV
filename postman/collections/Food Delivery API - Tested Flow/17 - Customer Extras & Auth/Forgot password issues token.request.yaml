$kind: http-request
url: "{{baseUrl}}/api/auth/password/forgot"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: '{"email":"pm{{pmStamp}}@example.com"}'
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const j = (() => { try { return pm.response.json(); } catch (e) { return null; } })();
      pm.test("Forgot password issues token: HTTP 200", () => pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([200]));
      pm.test("Forgot password issues token: nội dung", () => { pm.expect(j.resetToken, 'máy chủ test cần AUTH_EXPOSE_TOKENS=true').to.be.a('string'); pm.collectionVariables.set('pmReset', j.resetToken); });
    language: text/javascript
order: 14000
