$kind: http-request
url: "{{baseUrl}}/api/catalog/districts?city=H%C6%B0ng%20Y%C3%AAn"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const j = (() => { try { return pm.response.json(); } catch (e) { return null; } })();
      pm.test("Districts: HTTP 200", () => pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([200]));
      pm.test("Districts: nội dung", () => { pm.expect(j.items).to.be.an('array'); });
    language: text/javascript
order: 4000
