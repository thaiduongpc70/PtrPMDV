$kind: http-request
url: "{{baseUrl}}/api/auth/password/reset"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: '{"token":"{{pmReset}}","password":"Matkhau#67890"}'
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const j = (() => { try { return pm.response.json(); } catch (e) { return null; } })();
      pm.test("Reset password: HTTP 200", () => pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([200]));
      pm.test("Reset password: nội dung", () => { pm.expect(j.message).to.include('Đã đặt lại mật khẩu'); });
    language: text/javascript
order: 15000
