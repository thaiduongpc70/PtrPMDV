$kind: http-request
url: "{{baseUrl}}/api/catalog/search-history"
method: GET
headers:
  Authorization: Bearer {{customerToken}}
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const j = (() => { try { return pm.response.json(); } catch (e) { return null; } })();
      pm.test("Search history: HTTP 200", () => pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([200]));
      pm.test("Search history: nội dung", () => { pm.expect(j.items).to.be.an('array'); });
    language: text/javascript
order: 7000
