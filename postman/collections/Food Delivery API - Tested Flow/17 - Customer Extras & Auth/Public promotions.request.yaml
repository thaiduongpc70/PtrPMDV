$kind: http-request
url: "{{baseUrl}}/api/catalog/promotions"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const j = (() => { try { return pm.response.json(); } catch (e) { return null; } })();
      pm.test("Public promotions: HTTP 200", () => pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([200]));
      pm.test("Public promotions: nội dung", () => { pm.expect(j.items).to.be.an('array'); });
    language: text/javascript
order: 5000
