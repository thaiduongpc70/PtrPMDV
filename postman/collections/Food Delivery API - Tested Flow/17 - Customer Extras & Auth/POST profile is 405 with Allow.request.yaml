$kind: http-request
url: "{{baseUrl}}/api/customer/profile"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{newToken}}
body:
  type: text
  content: "{}"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const j = (() => { try { return pm.response.json(); } catch (e) { return null; } })();
      pm.test("POST profile is 405 with Allow: HTTP 405", () => pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([405]));
      pm.test("POST profile is 405 with Allow: nội dung", () => { pm.expect(pm.response.headers.get('Allow')).to.eql('GET, PATCH'); });
    language: text/javascript
order: 10000
