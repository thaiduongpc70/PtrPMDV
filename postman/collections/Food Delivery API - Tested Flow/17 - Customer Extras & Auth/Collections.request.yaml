$kind: http-request
url: "{{baseUrl}}/api/catalog/collections"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const j = (() => { try { return pm.response.json(); } catch (e) { return null; } })();
      pm.test("Collections: HTTP 200", () => pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([200]));
      pm.test("Collections: nội dung", () => { pm.expect(j.items).to.be.an('array').that.is.not.empty; pm.expect(j.items[0]).to.include.keys('key', 'title', 'count'); });
    language: text/javascript
order: 2000
