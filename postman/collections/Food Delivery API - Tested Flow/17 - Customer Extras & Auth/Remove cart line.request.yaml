$kind: http-request
url: "{{baseUrl}}/api/customer/cart/items/{{pmLineId}}"
method: DELETE
headers:
  Authorization: Bearer {{newToken}}
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const j = (() => { try { return pm.response.json(); } catch (e) { return null; } })();
      pm.test("Remove cart line: HTTP 204", () => pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([204]));
    language: text/javascript
order: 30000
