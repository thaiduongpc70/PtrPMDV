$kind: http-request
url: "{{baseUrl}}/api/customer/loyalty/rewards/1/redeem"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{newToken}}
body:
  type: text
  content: "{}"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const j = (() => { try { return pm.response.json(); } catch (e) { return null; } })();
      pm.test("Fresh customer has no points to redeem: HTTP 400/404", () => pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([400,404]));
      pm.test("Fresh customer has no points to redeem: nội dung", () => { pm.expect(j.message).to.be.a('string'); });
    language: text/javascript
order: 22000
