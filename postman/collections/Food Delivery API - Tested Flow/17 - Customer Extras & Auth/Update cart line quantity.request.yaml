$kind: http-request
url: "{{baseUrl}}/api/customer/cart/items/{{pmLineId}}"
method: PATCH
headers:
  Content-Type: application/json
  Authorization: Bearer {{newToken}}
body:
  type: text
  content: '{"quantity":2}'
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const j = (() => { try { return pm.response.json(); } catch (e) { return null; } })();
      pm.test("Update cart line quantity: HTTP 200", () => pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([200]));
      pm.test("Update cart line quantity: nội dung", () => { pm.expect((j.items || j.cart.items)[0].quantity).to.eql(2); });
    language: text/javascript
order: 28000
