$kind: http-request
url: "{{baseUrl}}/api/customer/favorites/menu-items/{{pmDishId}}"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{newToken}}
body:
  type: text
  content: "{}"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const j = (() => { try { return pm.response.json(); } catch (e) { return null; } })();
      pm.test("Fresh customer toggles dish favorite: HTTP 200", () => pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([200]));
      pm.test("Fresh customer toggles dish favorite: nội dung", () => { pm.expect(j.isFavorite).to.eql(true); });
    language: text/javascript
order: 19000
