$kind: http-request
url: "{{baseUrl}}/api/payments/cod/{{pmCodId}}/settle"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{adminToken}}
body:
  type: text
  content: "{}"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const j = (() => { try { return pm.response.json(); } catch (e) { return null; } })();
      pm.test("Settle COD: HTTP 200", () => pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([200]));
      pm.test("Settle COD: nội dung", () => { pm.expect(j.status).to.eql('SETTLED'); });
    language: text/javascript
order: 27000
