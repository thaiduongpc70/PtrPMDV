$kind: http-request
url: "{{baseUrl}}/api/analytics/customer/spending"
method: GET
headers:
  Authorization: Bearer {{customerToken}}
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const j = (() => { try { return pm.response.json(); } catch (e) { return null; } })();
      pm.test("Customer spending analytics: HTTP 200", () => pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([200]));
      pm.test("Customer spending analytics: nội dung", () => { pm.expect(j.series).to.be.an('array').that.is.not.empty; pm.expect(j.series[0]).to.include.keys('label', 'orders', 'spent'); });
    language: text/javascript
order: 4000
