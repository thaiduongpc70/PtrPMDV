$kind: http-request
url: "{{baseUrl}}/api/admin/manage/shippers/{{pmShipperId}}/status"
method: PATCH
headers:
  Content-Type: application/json
  Authorization: Bearer {{adminToken}}
body:
  type: text
  content: '{"status":"OFFLINE"}'
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const j = (() => { try { return pm.response.json(); } catch (e) { return null; } })();
      pm.test("Admin sets shipper offline: HTTP 200", () => pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([200]));
      pm.test("Admin sets shipper offline: nội dung", () => { pm.expect(j.status).to.eql('OFFLINE'); });
    language: text/javascript
order: 24000
