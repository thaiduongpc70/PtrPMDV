$kind: http-request
url: "{{baseUrl}}/api/shippers/profile"
method: PATCH
headers:
  Content-Type: application/json
  Authorization: Bearer {{shipperToken}}
body:
  type: text
  content: '{"vehicleType":"MOTORBIKE"}'
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const j = (() => { try { return pm.response.json(); } catch (e) { return null; } })();
      pm.test("Shipper updates profile: HTTP 200", () => pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([200]));
      pm.test("Shipper updates profile: nội dung", () => { pm.expect(j.vehicleType).to.eql('MOTORBIKE'); });
    language: text/javascript
order: 20000
