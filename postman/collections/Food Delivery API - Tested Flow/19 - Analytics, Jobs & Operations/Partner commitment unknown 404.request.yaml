$kind: http-request
url: "{{baseUrl}}/api/partners/commitments/khong-co"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const j = (() => { try { return pm.response.json(); } catch (e) { return null; } })();
      pm.test("Partner commitment unknown 404: HTTP 404", () => pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([404]));
      pm.test("Partner commitment unknown 404: nội dung", () => { pm.expect(j.message).to.be.a('string').that.is.not.empty; });
    language: text/javascript
order: 18000
