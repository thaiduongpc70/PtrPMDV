$kind: http-request
url: "{{baseUrl}}/api/analytics/shipper/performance"
method: GET
headers:
  Authorization: Bearer {{shipperToken}}
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const j = (() => { try { return pm.response.json(); } catch (e) { return null; } })();
      pm.test("Shipper performance analytics: HTTP 200", () => pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([200]));
      pm.test("Shipper performance analytics: nội dung", () => { pm.expect(j.items).to.have.lengthOf(1); pm.expect(j.items[0].deliveries).to.be.above(0); });
    language: text/javascript
order: 5000
