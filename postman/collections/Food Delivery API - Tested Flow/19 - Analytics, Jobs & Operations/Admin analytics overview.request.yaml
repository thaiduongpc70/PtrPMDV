$kind: http-request
url: "{{baseUrl}}/api/analytics/admin/overview"
method: GET
headers:
  Authorization: Bearer {{adminToken}}
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const j = (() => { try { return pm.response.json(); } catch (e) { return null; } })();
      pm.test("Admin analytics overview: HTTP 200", () => pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([200]));
      pm.test("Admin analytics overview: nội dung", () => { pm.expect(j).to.be.an('object'); });
    language: text/javascript
order: 1000
