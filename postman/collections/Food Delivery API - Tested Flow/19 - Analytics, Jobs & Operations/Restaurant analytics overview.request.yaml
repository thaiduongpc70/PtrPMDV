$kind: http-request
url: "{{baseUrl}}/api/analytics/restaurant/{{pmRid}}/overview"
method: GET
headers:
  Authorization: Bearer {{restaurantToken}}
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const j = (() => { try { return pm.response.json(); } catch (e) { return null; } })();
      pm.test("Restaurant analytics overview: HTTP 200", () => pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([200]));
      pm.test("Restaurant analytics overview: nội dung", () => { pm.expect(j.kpis.orders).to.be.above(0); pm.expect(j.range.days).to.be.above(0); });
    language: text/javascript
order: 3000
