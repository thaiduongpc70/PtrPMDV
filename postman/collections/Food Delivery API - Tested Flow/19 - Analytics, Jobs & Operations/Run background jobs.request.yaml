$kind: http-request
url: "{{baseUrl}}/api/jobs/background/run"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{adminToken}}
body:
  type: text
  content: "{}"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const j = (() => { try { return pm.response.json(); } catch (e) { return null; } })();
      pm.test("Run background jobs: HTTP 200", () => pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([200]));
      pm.test("Run background jobs: nội dung", () => { pm.expect(j.completedJobIds).to.be.an('array'); });
    language: text/javascript
order: 16000
