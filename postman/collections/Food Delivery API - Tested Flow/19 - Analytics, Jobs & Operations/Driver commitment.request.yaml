$kind: http-request
url: "{{baseUrl}}/api/partners/commitments/{{pmKind}}"
method: GET
auth:
  type: noauth
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set('pmKind', 'shipper');
    language: text/javascript
  - type: afterResponse
    code: |-
      const j = (() => { try { return pm.response.json(); } catch (e) { return null; } })();
      pm.test("Driver commitment: HTTP 200", () => pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([200]));
      pm.test("Driver commitment: nội dung", () => { pm.expect(j.version).to.exist; });
    language: text/javascript
order: 19000
