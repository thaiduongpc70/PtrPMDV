$kind: http-request
url: "{{baseUrl}}/api/accounts/admin/users/{{freshUserId}}/status"
method: PATCH
headers:
  Content-Type: "application/json"
  Authorization: "Bearer {{adminToken}}"
body:
  type: text
  content: |-
    {
      "status": "ACTIVE"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Update user status - restore: HTTP 200', () => pm.expect(pm.response.code).to.be.oneOf([200]));
    language: text/javascript
order: 4000
