$kind: http-request
url: "{{baseUrl}}/api/accounts/admin/users"
method: GET
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.json();
      const first = json.items?.[0];
      if (first?.id) pm.collectionVariables.set('userId', first.id);
    language: text/javascript
order: 1000
