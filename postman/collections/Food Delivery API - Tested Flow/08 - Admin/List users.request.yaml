$kind: http-request
url: "{{baseUrl}}/api/accounts/admin/users"
method: GET
headers:
  Content-Type: "application/json"
  Authorization: "Bearer {{adminToken}}"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('List users: HTTP 200', () => pm.expect(pm.response.code).to.be.oneOf([200]));
      pm.test("users listed", () => pm.expect(json.items.length > 0).to.be.true);
    language: text/javascript
order: 1000
