$kind: http-request
url: "{{baseUrl}}/api/partners/register/shipper"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "commitment": { "accepted": true, "readToEnd": true, "version": "{{pCommitVersion}}", "kind": "shipper" },
      "fullName": "Tài xế Postman",
      "username": "tx{{pSuffix}}",
      "email": "tx{{pSuffix}}@postman.test",
      "phone": "09{{pSuffix}}",
      "password": "duong2k5",
      "identityNumber": "079{{pSuffix}}",
      "vehicleType": "MOTORBIKE",
      "vehiclePlate": "59A1-{{pSuffix}}",
      "drivingLicense": "B2-{{pSuffix}}",
      "city": "TP.HCM"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Register shipper: HTTP 201', () => pm.expect(pm.response.code).to.be.oneOf([201]));
      pm.test("application is PENDING", () => pm.expect(json.status === "PENDING" && json.type === "SHIPPER").to.be.true);
      { const v = (json.applicationId); if (v !== undefined && v !== null) pm.collectionVariables.set('shipAppId', v); }
    language: text/javascript
order: 2000
