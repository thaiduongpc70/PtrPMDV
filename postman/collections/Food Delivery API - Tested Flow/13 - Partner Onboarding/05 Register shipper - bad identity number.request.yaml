$kind: http-request
url: "{{baseUrl}}/api/partners/register/shipper"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "commitment": { "accepted": true, "readToEnd": true, "version": "{{pCommitVersion}}", "kind": "shipper" },
      "fullName": "Tài xế Postman",
      "username": "bad{{pSuffix}}",
      "email": "tx{{pSuffix}}@postman.test",
      "phone": "09{{pSuffix}}",
      "password": "duong2k5",
      "identityNumber": "12",
      "vehicleType": "MOTORBIKE",
      "vehiclePlate": "59A1-{{pSuffix}}",
      "drivingLicense": "B2-{{pSuffix}}",
      "city": "TP.HCM"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Register shipper - bad identity number: HTTP 400', () => pm.expect(pm.response.code).to.be.oneOf([400]));
      pm.test('lỗi đúng nguyên nhân (không phải do cam kết)', () => pm.expect(pm.response.json().message).to.not.include('cam kết'));
    language: text/javascript
order: 5000
