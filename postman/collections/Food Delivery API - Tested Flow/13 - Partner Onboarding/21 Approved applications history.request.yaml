$kind: http-request
url: "{{baseUrl}}/api/admin/partners/applications?status=APPROVED"
method: GET
headers:
  Content-Type: "application/json"
  Authorization: "Bearer {{adminToken}}"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Approved applications history: HTTP 200', () => pm.expect(pm.response.code).to.be.oneOf([200]));
      pm.test("approved history has review time", () => pm.expect(json.items.some(a => a.status === "APPROVED" && a.reviewedAt)).to.be.true);
    language: text/javascript
order: 21000
