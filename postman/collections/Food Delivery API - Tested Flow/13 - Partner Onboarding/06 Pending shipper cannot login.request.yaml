$kind: http-request
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: "application/json"
body:
  type: text
  content: |-
    {
      "emailOrUsername": "tx{{pSuffix}}",
      "password": "duong2k5"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Pending shipper cannot login: HTTP 403', () => pm.expect(pm.response.code).to.be.oneOf([403]));
      pm.test("login says PENDING", () => pm.expect(json.message === "Account is PENDING").to.be.true);
    language: text/javascript
order: 6000
