$kind: http-request
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: "application/json"
body:
  type: text
  content: |-
    {
      "emailOrUsername": "tx{{pSuffix}}",
      "password": "duong2k5"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Approved shipper can login: HTTP 200', () => pm.expect(pm.response.code).to.be.oneOf([200]));
      pm.test("role is SHIPPER", () => pm.expect(json.user.role === "SHIPPER").to.be.true);
    language: text/javascript
order: 15000
