$kind: http-request
url: "{{baseUrl}}/api/deliveries/active"
method: GET
headers:
  Content-Type: "application/json"
  Authorization: "Bearer {{adminToken}}"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Active deliveries (admin): HTTP 200', () => pm.expect(pm.response.code).to.be.oneOf([200]));
      pm.test("items array", () => pm.expect(Array.isArray(json.items)).to.be.true);
    language: text/javascript
order: 2000
