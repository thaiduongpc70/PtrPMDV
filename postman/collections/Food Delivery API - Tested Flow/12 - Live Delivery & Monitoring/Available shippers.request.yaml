$kind: http-request
url: "{{baseUrl}}/api/deliveries/available-shippers"
method: GET
headers:
  Content-Type: "application/json"
  Authorization: "Bearer {{restaurantToken}}"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Available shippers: HTTP 200', () => pm.expect(pm.response.code).to.be.oneOf([200]));
      pm.test("items array", () => pm.expect(Array.isArray(json.items)).to.be.true);
    language: text/javascript
order: 1000
