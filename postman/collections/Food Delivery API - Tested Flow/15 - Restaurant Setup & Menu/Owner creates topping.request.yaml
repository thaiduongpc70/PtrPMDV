$kind: http-request
url: "{{baseUrl}}/api/restaurant/restaurants/{{pmRid}}/topping-groups/{{pmGroupId}}/toppings"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{restaurantToken}}
body:
  type: text
  content: '{"name":"Trứng","price":8000}'
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const j = (() => { try { return pm.response.json(); } catch (e) { return null; } })();
      pm.test("Owner creates topping: HTTP 201", () => pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([201]));
      pm.test("Owner creates topping: nội dung", () => { pm.collectionVariables.set('pmToppingId', String((j.id || j.topping.id))); });
    language: text/javascript
order: 27000
