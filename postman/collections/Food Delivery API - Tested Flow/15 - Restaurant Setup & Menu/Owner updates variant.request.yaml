$kind: http-request
url: "{{baseUrl}}/api/restaurant/restaurants/{{pmRid}}/menu-items/{{pmTmpItemId}}/variants/{{pmVariantId}}"
method: PATCH
headers:
  Content-Type: application/json
  Authorization: Bearer {{restaurantToken}}
body:
  type: text
  content: '{"priceAdjustment":7000}'
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const j = (() => { try { return pm.response.json(); } catch (e) { return null; } })();
      pm.test("Owner updates variant: HTTP 200", () => pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([200]));
      pm.test("Owner updates variant: nội dung", () => { pm.expect(j.priceAdjustment).to.eql(7000); pm.expect(j.name).to.eql('Cỡ lớn'); });
    language: text/javascript
order: 23000
