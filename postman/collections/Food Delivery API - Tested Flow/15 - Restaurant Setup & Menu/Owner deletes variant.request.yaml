$kind: http-request
url: "{{baseUrl}}/api/restaurant/restaurants/{{pmRid}}/menu-items/{{pmTmpItemId}}/variants/{{pmVariantId}}"
method: DELETE
headers:
  Authorization: Bearer {{restaurantToken}}
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const j = (() => { try { return pm.response.json(); } catch (e) { return null; } })();
      pm.test("Owner deletes variant: HTTP 200/204", () => pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([200,204]));
    language: text/javascript
order: 33000
