$kind: http-request
url: "{{baseUrl}}/api/restaurant/restaurants/{{pmRid}}/images/{{pmImageId}}"
method: PATCH
headers:
  Content-Type: application/json
  Authorization: Bearer {{restaurantToken}}
body:
  type: text
  content: '{"sortOrder":5}'
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const j = (() => { try { return pm.response.json(); } catch (e) { return null; } })();
      pm.test("Owner updates image: HTTP 200", () => pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([200]));
      pm.test("Owner updates image: nội dung", () => { pm.expect(j.sortOrder).to.eql(5); });
    language: text/javascript
order: 7000
