$kind: http-request
url: "{{baseUrl}}/api/restaurant/restaurants/{{pmRid}}/menu-items/{{pmTmpItemId}}/topping-groups"
method: PUT
headers:
  Content-Type: application/json
  Authorization: Bearer {{restaurantToken}}
body:
  type: text
  content: '{"groupIds":[{{pmGroupId}}]}'
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const j = (() => { try { return pm.response.json(); } catch (e) { return null; } })();
      pm.test("Owner links topping group: HTTP 200", () => pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([200]));
      pm.test("Owner links topping group: nội dung", () => { pm.expect(j.groupIds.map(String)).to.include(pm.collectionVariables.get('pmGroupId')); });
    language: text/javascript
order: 30000
