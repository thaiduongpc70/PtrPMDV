$kind: http-request
url: "{{baseUrl}}/api/restaurant/restaurants/{{pmRid}}/topping-groups"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{restaurantToken}}
body:
  type: text
  content: '{"name":"Topping Postman","minSelect":0,"maxSelect":2}'
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const j = (() => { try { return pm.response.json(); } catch (e) { return null; } })();
      pm.test("Owner creates topping group: HTTP 201", () => pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([201]));
      pm.test("Owner creates topping group: nội dung", () => { pm.collectionVariables.set('pmGroupId', String((j.id || j.group.id))); });
    language: text/javascript
order: 24000
