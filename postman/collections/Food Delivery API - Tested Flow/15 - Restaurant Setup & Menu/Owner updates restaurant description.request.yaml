$kind: http-request
url: "{{baseUrl}}/api/restaurant/restaurants/{{pmRid}}"
method: PATCH
headers:
  Content-Type: application/json
  Authorization: Bearer {{restaurantToken}}
body:
  type: text
  content: '{"description":"Mô tả cập nhật bởi Postman"}'
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const j = (() => { try { return pm.response.json(); } catch (e) { return null; } })();
      pm.test("Owner updates restaurant description: HTTP 200", () => pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([200]));
      pm.test("Owner updates restaurant description: nội dung", () => { pm.expect(j.description || j.restaurant.description).to.include('Postman'); });
    language: text/javascript
order: 3000
