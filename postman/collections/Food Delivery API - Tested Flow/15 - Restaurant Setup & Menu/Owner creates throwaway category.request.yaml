$kind: http-request
url: "{{baseUrl}}/api/restaurant/restaurants/{{pmRid}}/menu-categories"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{restaurantToken}}
body:
  type: text
  content: '{"menuId":{{pmTmpMenuId}},"name":"Nhóm sẽ xoá"}'
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const j = (() => { try { return pm.response.json(); } catch (e) { return null; } })();
      pm.test("Owner creates throwaway category: HTTP 201", () => pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([201]));
      pm.test("Owner creates throwaway category: nội dung", () => { pm.collectionVariables.set('pmTmpCatId', String((j.id || j.category.id))); });
    language: text/javascript
order: 39000
