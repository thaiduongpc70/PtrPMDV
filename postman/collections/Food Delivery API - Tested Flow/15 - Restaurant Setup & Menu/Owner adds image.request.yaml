$kind: http-request
url: "{{baseUrl}}/api/restaurant/restaurants/{{pmRid}}/images"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{restaurantToken}}
body:
  type: text
  content: '{"imageUrl":"https://example.com/pm.jpg","imageType":"GALLERY"}'
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const j = (() => { try { return pm.response.json(); } catch (e) { return null; } })();
      pm.test("Owner adds image: HTTP 201", () => pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([201]));
      pm.test("Owner adds image: nội dung", () => { pm.collectionVariables.set('pmImageId', String((j.id || j.image.id))); });
    language: text/javascript
order: 6000
