$kind: http-request
url: "{{baseUrl}}/api/restaurant/restaurants"
method: GET
headers:
  Authorization: Bearer {{restaurantToken}}
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const j = (() => { try { return pm.response.json(); } catch (e) { return null; } })();
      pm.test("Owner lists own restaurants: HTTP 200", () => pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([200]));
      pm.test("Owner lists own restaurants: nội dung", () => { pm.expect(j.items).to.be.an('array').that.is.not.empty; pm.collectionVariables.set('pmRid', String(j.items[0].id)); });
    language: text/javascript
order: 1000
