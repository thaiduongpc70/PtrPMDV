$kind: http-request
url: "{{baseUrl}}/api/restaurant/restaurants/{{pmRid}}/menus"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{restaurantToken}}
body:
  type: text
  content: '{"name":"Thực đơn Postman","description":"thử"}'
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const j = (() => { try { return pm.response.json(); } catch (e) { return null; } })();
      pm.test("Owner creates menu: HTTP 201", () => pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([201]));
      pm.test("Owner creates menu: nội dung", () => { pm.collectionVariables.set('pmMenuId', String((j.id || j.menu.id))); });
    language: text/javascript
order: 9000
