$kind: http-request
url: "{{baseUrl}}/api/admin/manage/promotions"
method: POST
headers:
  Content-Type: "application/json"
  Authorization: "Bearer {{adminToken}}"
body:
  type: text
  content: |-
    {
      "code": "{{promoCode}}",
      "name": "dup",
      "discountType": "PERCENT",
      "discountValue": 5
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Duplicate promotion code rejected: HTTP 409', () => pm.expect(pm.response.code).to.be.oneOf([409]));
    language: text/javascript
order: 14000
