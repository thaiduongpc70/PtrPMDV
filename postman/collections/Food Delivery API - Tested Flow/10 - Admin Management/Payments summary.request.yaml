$kind: http-request
url: "{{baseUrl}}/api/admin/manage/payments?pageSize=5"
method: GET
headers:
  Content-Type: "application/json"
  Authorization: "Bearer {{adminToken}}"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Payments summary: HTTP 200', () => pm.expect(pm.response.code).to.be.oneOf([200]));
      pm.test("summary, methods and cod present", () => pm.expect(Array.isArray(json.summary) && Array.isArray(json.methods) && Array.isArray(json.cod)).to.be.true);
    language: text/javascript
order: 7000
