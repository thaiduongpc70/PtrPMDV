$kind: http-request
url: "{{baseUrl}}/api/admin/manage/promotions"
method: POST
headers:
  Content-Type: "application/json"
  Authorization: "Bearer {{adminToken}}"
body:
  type: text
  content: |-
    {
      "code": "{{promoCode}}",
      "name": "Postman test promo",
      "discountType": "PERCENT",
      "discountValue": 10,
      "maxDiscount": 20000,
      "minimumOrder": 50000
    }
auth:
  type: noauth
scripts:
  - type: beforeRequest
    code: |-
      pm.collectionVariables.set('promoCode', 'PM' + Date.now().toString(36).toUpperCase());
    language: text/javascript
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Create promotion: HTTP 201', () => pm.expect(pm.response.code).to.be.oneOf([201]));
      { const v = (json.id); if (v !== undefined && v !== null) pm.collectionVariables.set('promoId', v); }
    language: text/javascript
order: 13000
