$kind: http-request
url: "{{baseUrl}}/api/admin/manage/orders/{{adminOrderId}}"
method: GET
headers:
  Content-Type: "application/json"
  Authorization: "Bearer {{adminToken}}"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Order detail: HTTP 200', () => pm.expect(pm.response.code).to.be.oneOf([200]));
      pm.test("detail has items/history/payments", () => pm.expect(Array.isArray(json.items) && Array.isArray(json.history) && Array.isArray(json.payments)).to.be.true);
    language: text/javascript
order: 3000
