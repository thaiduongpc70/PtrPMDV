$kind: http-request
url: "{{baseUrl}}/api/restaurant/manage/{{restaurantId}}/hours"
method: GET
headers:
  Content-Type: "application/json"
  Authorization: "Bearer {{restaurantToken}}"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Opening hours: HTTP 200', () => pm.expect(pm.response.code).to.be.oneOf([200]));
      pm.test("seven days", () => pm.expect(json.items.length).to.eql(7));
      pm.collectionVariables.set('hoursJson', JSON.stringify({ items: json.items }));
    language: text/javascript
order: 5000
