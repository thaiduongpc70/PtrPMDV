$kind: http-request
url: "{{baseUrl}}/api/restaurant/manage/{{restaurantId}}/hours"
method: PUT
headers:
  Content-Type: "application/json"
  Authorization: "Bearer {{restaurantToken}}"
body:
  type: text
  content: |-
    {{hoursJson}}
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Save opening hours: HTTP 200', () => pm.expect(pm.response.code).to.be.oneOf([200]));
    language: text/javascript
order: 6000
