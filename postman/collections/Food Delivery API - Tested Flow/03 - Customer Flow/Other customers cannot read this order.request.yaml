$kind: http-request
url: "{{baseUrl}}/api/customer/orders/{{orderId}}"
method: GET
headers:
  Content-Type: "application/json"
  Authorization: "Bearer {{freshToken}}"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Other customers cannot read this order: HTTP 403/404', () => pm.expect(pm.response.code).to.be.oneOf([403, 404]));
    language: text/javascript
order: 13000
