$kind: http-request
url: "{{baseUrl}}/api/restaurant/restaurants"
method: GET
headers:
  Content-Type: "application/json"
  Authorization: "Bearer {{restaurantToken}}"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Setup - owner restaurant: HTTP 200', () => pm.expect(pm.response.code).to.be.oneOf([200]));
      { const v = ((json.items || json)[0]?.id); if (v !== undefined && v !== null) pm.collectionVariables.set('restaurantId', v); }
    language: text/javascript
order: 1000
