$kind: http-request
url: "{{baseUrl}}/api/customer/orders/{{orderId}}"
method: GET
headers:
  Content-Type: "application/json"
  Authorization: "Bearer {{customerToken}}"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Get customer order detail: HTTP 200', () => pm.expect(pm.response.code).to.be.oneOf([200]));
      pm.test("items and total present", () => pm.expect(json.items.length >= 1 && json.totalAmount > 0).to.be.true);
    language: text/javascript
order: 12000
