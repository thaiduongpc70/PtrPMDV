$kind: http-request
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: "application/json"
body:
  type: text
  content: |-
    {
      "emailOrUsername": "minh.anh",
      "password": "duong2k5"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Login customer: HTTP 200', () => pm.expect(pm.response.code).to.be.oneOf([200]));
      pm.test("role is CUSTOMER", () => pm.expect(json.user.role).to.eql("CUSTOMER"));
      pm.collectionVariables.set('customerToken', json.accessToken);
      pm.collectionVariables.set('customerRefresh', json.refreshToken);
    language: text/javascript
order: 3000
