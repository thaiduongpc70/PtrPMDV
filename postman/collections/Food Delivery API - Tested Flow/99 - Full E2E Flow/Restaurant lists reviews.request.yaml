$kind: http-request
url: "{{baseUrl}}/api/restaurant/manage/{{restaurantId}}/reviews"
method: GET
headers:
  Content-Type: "application/json"
  Authorization: "Bearer {{restaurantToken}}"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Restaurant lists reviews: HTTP 200', () => pm.expect(pm.response.code).to.be.oneOf([200]));
      { const v = (json.items.find(r => r.orderCode === pm.collectionVariables.get('orderCode'))?.id); if (v !== undefined && v !== null) pm.collectionVariables.set('reviewId', v); }
    language: text/javascript
order: 54000
