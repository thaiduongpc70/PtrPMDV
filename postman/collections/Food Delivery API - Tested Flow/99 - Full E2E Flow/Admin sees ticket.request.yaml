$kind: http-request
url: "{{baseUrl}}/api/communications/support/tickets"
method: GET
headers:
  Content-Type: "application/json"
  Authorization: "Bearer {{adminToken}}"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Admin sees ticket: HTTP 200', () => pm.expect(pm.response.code).to.be.oneOf([200]));
      pm.test("ticket listed", () => pm.expect(json.items.some(t => t.id === Number(pm.collectionVariables.get('ticketId')))).to.be.true);
    language: text/javascript
order: 63000
