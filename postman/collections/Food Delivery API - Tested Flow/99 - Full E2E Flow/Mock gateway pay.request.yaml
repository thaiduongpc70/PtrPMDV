$kind: http-request
url: "{{baseUrl}}/api/payments/orders/{{orderId}}/mock-pay"
method: POST
headers:
  Content-Type: "application/json"
  Authorization: "Bearer {{customerToken}}"
body:
  type: text
  content: |-
    {
      "outcome": "PAID"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Mock gateway pay: HTTP 200', () => pm.expect(pm.response.code).to.be.oneOf([200]));
      pm.test("payment PAID", () => pm.expect(json.status).to.eql("PAID"));
    language: text/javascript
order: 26000
