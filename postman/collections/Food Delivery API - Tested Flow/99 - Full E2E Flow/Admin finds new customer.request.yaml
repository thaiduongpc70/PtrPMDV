$kind: http-request
url: "{{baseUrl}}/api/admin/manage/customers?q={{regUser}}"
method: GET
headers:
  Content-Type: "application/json"
  Authorization: "Bearer {{adminToken}}"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Admin finds new customer: HTTP 200', () => pm.expect(pm.response.code).to.be.oneOf([200]));
      pm.test("registered customer listed", () => pm.expect(json.items.length === 1).to.be.true);
    language: text/javascript
order: 58000
