$kind: http-request
url: "{{baseUrl}}/api/shippers/earnings"
method: GET
headers:
  Content-Type: "application/json"
  Authorization: "Bearer {{shipperToken}}"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Shipper earnings: HTTP 200', () => pm.expect(pm.response.code).to.be.oneOf([200]));
      pm.test("earnings recorded", () => pm.expect(json.totalEarnings > 0).to.be.true);
    language: text/javascript
order: 70000
