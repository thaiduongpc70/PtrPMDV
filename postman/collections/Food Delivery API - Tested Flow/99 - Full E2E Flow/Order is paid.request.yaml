$kind: http-request
url: "{{baseUrl}}/api/customer/orders/{{orderId}}"
method: GET
headers:
  Content-Type: "application/json"
  Authorization: "Bearer {{customerToken}}"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Order is paid: HTTP 200', () => pm.expect(pm.response.code).to.be.oneOf([200]));
      pm.test("order paymentStatus PAID", () => pm.expect(json.paymentStatus).to.eql("PAID"));
    language: text/javascript
order: 27000
