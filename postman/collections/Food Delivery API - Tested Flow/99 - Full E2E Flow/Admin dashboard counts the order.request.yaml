$kind: http-request
url: "{{baseUrl}}/api/admin/dashboard"
method: GET
headers:
  Content-Type: "application/json"
  Authorization: "Bearer {{adminToken}}"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Admin dashboard counts the order: HTTP 200', () => pm.expect(pm.response.code).to.be.oneOf([200]));
      pm.test("dashboard totals", () => pm.expect(json.overview.totalOrders >= 1).to.be.true);
    language: text/javascript
order: 56000
