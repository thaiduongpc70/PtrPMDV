$kind: http-request
url: "{{baseUrl}}/api/admin/manage/payments?status=PAID&pageSize=50"
method: GET
headers:
  Content-Type: "application/json"
  Authorization: "Bearer {{adminToken}}"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Admin payments include order: HTTP 200', () => pm.expect(pm.response.code).to.be.oneOf([200]));
      pm.test("paid payments exist", () => pm.expect(json.totalItems >= 1).to.be.true);
    language: text/javascript
order: 59000
