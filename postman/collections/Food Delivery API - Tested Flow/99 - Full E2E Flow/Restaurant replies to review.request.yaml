$kind: http-request
url: "{{baseUrl}}/api/restaurant/manage/{{restaurantId}}/reviews/{{reviewId}}/reply"
method: POST
headers:
  Content-Type: "application/json"
  Authorization: "Bearer {{restaurantToken}}"
body:
  type: text
  content: |-
    {
      "reply": "Cảm ơn bạn đã ủng hộ quán!"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Restaurant replies to review: HTTP 200', () => pm.expect(pm.response.code).to.be.oneOf([200]));
    language: text/javascript
order: 55000
