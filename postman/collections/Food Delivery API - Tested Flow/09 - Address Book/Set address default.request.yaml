$kind: http-request
url: "{{baseUrl}}/api/customer/addresses/{{tmpAddressId}}/default"
method: POST
headers:
  Content-Type: "application/json"
  Authorization: "Bearer {{customerToken}}"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Set address default: HTTP 200', () => pm.expect(pm.response.code).to.be.oneOf([200]));
    language: text/javascript
order: 5000
