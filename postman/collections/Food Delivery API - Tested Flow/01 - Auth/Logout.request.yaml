$kind: http-request
url: "{{baseUrl}}/api/auth/logout"
method: POST
headers:
  Content-Type: "application/json"
body:
  type: text
  content: |-
    {
      "refreshToken": "{{freshRefresh}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Logout: HTTP 200/204', () => pm.expect(pm.response.code).to.be.oneOf([200, 204]));
    language: text/javascript
order: 16000
