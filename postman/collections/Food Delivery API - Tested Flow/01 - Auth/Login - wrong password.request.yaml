$kind: http-request
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: "application/json"
body:
  type: text
  content: |-
    {
      "emailOrUsername": "minh.anh",
      "password": "sai-mat-khau"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Login - wrong password: HTTP 401', () => pm.expect(pm.response.code).to.be.oneOf([401]));
    language: text/javascript
order: 8000
