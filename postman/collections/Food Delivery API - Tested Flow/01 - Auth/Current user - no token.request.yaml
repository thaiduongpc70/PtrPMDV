$kind: http-request
url: "{{baseUrl}}/api/auth/me"
method: GET
headers:
  Content-Type: "application/json"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Current user - no token: HTTP 401', () => pm.expect(pm.response.code).to.be.oneOf([401]));
    language: text/javascript
order: 11000
