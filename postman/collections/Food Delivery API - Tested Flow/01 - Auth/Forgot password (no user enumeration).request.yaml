$kind: http-request
url: "{{baseUrl}}/api/auth/password/forgot"
method: POST
headers:
  Content-Type: "application/json"
body:
  type: text
  content: |-
    {
      "email": "khong.ton.tai@example.vn"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Forgot password (no user enumeration): HTTP 200/202', () => pm.expect(pm.response.code).to.be.oneOf([200, 202]));
    language: text/javascript
