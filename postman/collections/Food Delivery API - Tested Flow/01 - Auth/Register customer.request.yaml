$kind: http-request
url: "{{baseUrl}}/api/auth/register/customer"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "username": "customer01",
      "email": "customer01@example.com",
      "phone": "0900000001",
      "password": "FoodDemo!2026",
      "fullName": "Nguyen Van A",
      "gender": "OTHER"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.json();
      if (json.accessToken) pm.collectionVariables.set('accessToken', json.accessToken);
      if (json.refreshToken) pm.collectionVariables.set('refreshToken', json.refreshToken);
      if (json.user?.id) pm.collectionVariables.set('userId', json.user.id);
    language: text/javascript
order: 1000
