$kind: http-request
url: "{{baseUrl}}/api/accounts/session"
method: GET
headers:
  Content-Type: "application/json"
  Authorization: "Bearer {{customerToken}}"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Session permissions: HTTP 200', () => pm.expect(pm.response.code).to.be.oneOf([200]));
      pm.test("permissions listed", () => pm.expect(Array.isArray(json.permissions) && json.permissions.length > 0).to.be.true);
    language: text/javascript
order: 12000
