$kind: http-request
url: "{{baseUrl}}/api/restaurant/restaurants/{{restaurantId}}/menu-items"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "Cơm gà xối mỡ",
      "description": "Cơm gà dùng để test API",
      "basePrice": 45000,
      "discountPrice": null,
      "preparationTime": 15,
      "isAvailable": true,
      "isFeatured": true
    }
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.json();
      if (json.id) pm.collectionVariables.set('menuItemId', json.id);
    language: text/javascript
order: 2000
