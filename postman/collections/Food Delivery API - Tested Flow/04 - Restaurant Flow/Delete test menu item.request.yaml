$kind: http-request
url: "{{baseUrl}}/api/restaurant/restaurants/{{restaurantId}}/menu-items/{{tmpItemId}}"
method: DELETE
headers:
  Content-Type: "application/json"
  Authorization: "Bearer {{restaurantToken}}"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Delete test menu item: HTTP 200/204', () => pm.expect(pm.response.code).to.be.oneOf([200, 204]));
    language: text/javascript
order: 5000
