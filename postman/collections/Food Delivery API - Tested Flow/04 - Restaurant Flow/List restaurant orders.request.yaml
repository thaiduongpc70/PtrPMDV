$kind: http-request
url: "{{baseUrl}}/api/restaurant/orders"
method: GET
headers:
  Content-Type: "application/json"
  Authorization: "Bearer {{restaurantToken}}"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('List restaurant orders: HTTP 200', () => pm.expect(pm.response.code).to.be.oneOf([200]));
      pm.test("order is in the kitchen queue", () => pm.expect((json.items || json).some(o => o.id === Number(pm.collectionVariables.get('orderId')))).to.be.true);
    language: text/javascript
order: 7000
