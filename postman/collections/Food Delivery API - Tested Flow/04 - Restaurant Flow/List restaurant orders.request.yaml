$kind: http-request
url: "{{baseUrl}}/api/restaurant/orders"
method: GET
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.json();
      const first = json.items?.[0];
      if (first?.id) pm.collectionVariables.set('orderId', first.id);
    language: text/javascript
order: 4000
