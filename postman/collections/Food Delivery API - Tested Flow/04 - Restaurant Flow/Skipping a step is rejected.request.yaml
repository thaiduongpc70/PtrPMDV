$kind: http-request
url: "{{baseUrl}}/api/restaurant/orders/{{orderId}}/ready"
method: POST
headers:
  Content-Type: "application/json"
  Authorization: "Bearer {{restaurantToken}}"
body:
  type: text
  content: |-
    {}
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Skipping a step is rejected: HTTP 400/409/422', () => pm.expect(pm.response.code).to.be.oneOf([400, 409, 422]));
    language: text/javascript
order: 8000
