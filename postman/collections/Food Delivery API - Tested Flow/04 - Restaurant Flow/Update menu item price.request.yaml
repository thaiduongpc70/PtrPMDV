$kind: http-request
url: "{{baseUrl}}/api/restaurant/restaurants/{{restaurantId}}/menu-items/{{tmpItemId}}"
method: PATCH
headers:
  Content-Type: "application/json"
  Authorization: "Bearer {{restaurantToken}}"
body:
  type: text
  content: |-
    {
      "basePrice": 49000
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Update menu item price: HTTP 200', () => pm.expect(pm.response.code).to.be.oneOf([200]));
    language: text/javascript
order: 4000
