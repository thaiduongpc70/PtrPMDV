$kind: http-request
url: "{{baseUrl}}/api/catalog/restaurants?pageSize=20"
method: GET
headers:
  Content-Type: "application/json"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Pick another restaurant: HTTP 200', () => pm.expect(pm.response.code).to.be.oneOf([200]));
      { const v = (json.items.find(r => String(r.id) !== String(pm.collectionVariables.get("ownRestaurantId")))?.id); if (v !== undefined && v !== null) pm.collectionVariables.set('otherRestaurantId', v); }
    language: text/javascript
order: 22000
