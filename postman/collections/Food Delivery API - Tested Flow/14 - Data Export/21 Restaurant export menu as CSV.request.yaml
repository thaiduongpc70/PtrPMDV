$kind: http-request
url: "{{baseUrl}}/api/restaurant/export/{{ownRestaurantId}}/menu?format=csv"
method: GET
headers:
  Content-Type: "application/json"
  Authorization: "Bearer {{restaurantToken}}"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.text() ? (() => { try { return pm.response.json(); } catch (e) { return null; } })() : null;
      pm.test('Restaurant export menu as CSV: HTTP 200', () => pm.expect(pm.response.code).to.be.oneOf([200]));
      pm.test("content-type is CSV", () => pm.expect(pm.response.headers.get("Content-Type").includes("text/csv")).to.be.true);
    language: text/javascript
order: 21000
